<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데블스 게임룸</title>
  <style>
:root {
  --bg: #0d0d10;
  --bg2: #16161b;
  --bg3: #1f1f26;
  --line: #2c2c36;
  --text: #ececf1;
  --muted: #9a9aa8;
  --red: #e5383b;
  --red2: #a4161a;
  --gold: #f2c14e;
  --green: #4caf7a;
  --blue: #4a90e2;
  --purple: #9b6dff;
  --radius: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
body { min-height: 100vh; }
#app { max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px; }
button { font: inherit; color: inherit; }
h2, h3 { margin: 0; }

/* ---------- 허브 ---------- */
.hub-head { padding: 28px 0 12px; }
.logo { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lang-pick { display: inline-flex; align-items: center; gap: 6px; }
.lang-select { padding: 6px 8px; font-size: 14px; }
.logo .ver { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.logo .eye { color: var(--red); text-shadow: 0 0 18px var(--red); }
.hub-head p { color: var(--muted); max-width: 720px; line-height: 1.6; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 16px; }
.tab { background: var(--bg2); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tab.on { background: var(--red2); border-color: var(--red); color: #fff; }
.day-title { font-size: 15px; letter-spacing: 3px; color: var(--red); margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.day-title small { color: var(--muted); letter-spacing: 0; font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: transform .12s, border-color .12s; display: flex; flex-direction: column; gap: 6px; }
.gcard:hover { transform: translateY(-2px); border-color: var(--red); }
.gcard.disabled { opacity: .45; }
.gcard.disabled:hover { transform: none; border-color: var(--line); }
.gtags { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.slot, .fid { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.slot.main { color: var(--gold); border-color: #6b5520; }
.slot.prison { color: #ff6b6b; border-color: #6b2020; }
.slot.exile { color: #8fb6ff; border-color: #24406b; }
.slot.mini { color: #c6a7ff; border-color: #44306b; }
.slot.etc { color: var(--muted); }
.fid.ok { color: var(--green); border-color: #245a3c; }
.fid.adapt { color: #e0a96d; border-color: #5a4224; }
.fid.none { color: var(--muted); }
.gname { font-size: 19px; font-weight: 700; }
.gen { font-size: 12px; color: var(--muted); }
.gsum { font-size: 13px; color: #c8c8d2; line-height: 1.5; flex: 1; }
.gplayers { font-size: 12px; color: var(--muted); }

/* ---------- 게임 공통 ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.topbar .ttl { flex: 1; font-weight: 700; font-size: 18px; display: flex; flex-direction: column; }
.topbar .ttl small { font-size: 11px; color: var(--muted); font-weight: 400; }
.tb-right { display: flex; gap: 6px; }
.btn { background: var(--bg3); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: background .1s; }
.btn:hover:not(:disabled) { background: #2a2a33; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--red2); border-color: var(--red); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--red); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.on { border-color: var(--gold); color: var(--gold); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.panel h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.split { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.big { font-size: 28px; font-weight: 800; }
.muted { color: var(--muted); }
.center { text-align: center; }
.hl { color: var(--gold); font-weight: 700; }
.bad { color: #ff6b6b; }
.good { color: var(--green); }
.log { max-height: 260px; overflow: auto; font-size: 13px; line-height: 1.6; color: #c8c8d2; }
.log div { border-bottom: 1px dashed #24242c; padding: 2px 0; }
.stat { display: inline-flex; flex-direction: column; background: var(--bg3); border-radius: 8px; padding: 6px 12px; min-width: 70px; }
.stat b { font-size: 20px; }
.stat span { font-size: 11px; color: var(--muted); }
input[type=number], input[type=text], select { background: var(--bg3); border: 1px solid var(--line); color: var(--text); padding: 8px 10px; border-radius: 8px; font: inherit; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 500; font-size: 12px; }
.tbl tr.me td { color: var(--gold); }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px; }
.timer.warn { color: var(--red); }

/* 로비 · 대기실 · 가림막 */
.lobby-wrap { display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
.mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mode-tab { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px; cursor: pointer; font-weight: 700; color: var(--muted); }
.mode-tab.on { background: var(--red2); border-color: var(--red); color: #fff; }
.fill-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.fill-toggle input { width: 18px; height: 18px; accent-color: var(--red); }
.lobby { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.diag { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.chip { background: var(--bg3); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.chip.empty { color: var(--muted); border-style: dashed; }
.room-code { font-size: 48px; font-weight: 900; letter-spacing: 10px; color: var(--gold); cursor: pointer; font-variant-numeric: tabular-nums; }
.turn-banner { background: var(--red2); color: #fff; padding: 8px 14px; border-radius: 8px; margin-bottom: 12px; font-weight: 700; }
.curtain { position: fixed; inset: 0; background: #0b0b0e; z-index: 40; align-items: center; justify-content: center; }
.curtain-box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 20px; }
.eye-big { font-size: 80px; color: var(--red); text-shadow: 0 0 30px var(--red); line-height: 1; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; }
.scores .stat.me b { color: var(--gold); }

/* 모달 & 토스트 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: 620px; width: 100%; max-height: 86vh; overflow: auto; }
.modal h3 { margin-bottom: 12px; color: var(--red); }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.rules { line-height: 1.7; font-size: 14px; color: #d6d6de; }
.rules ul { padding-left: 20px; margin: 6px 0; }
.rules .note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: #2a2a33; border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* 트럼프 카드 */
.pcard { width: 52px; height: 72px; border-radius: 7px; background: #f4f1ea; color: #1a1a1a; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; border: 2px solid transparent; user-select: none; }
.pcard b { font-size: 20px; line-height: 1; }
.pcard span { font-size: 18px; }
.pcard.red { color: #c0262b; }
.pcard.back { background: repeating-linear-gradient(45deg, var(--red2), var(--red2) 6px, #7a1013 6px, #7a1013 12px); border-color: #3a0a0b; }
.pcard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.pcard.dim { opacity: .35; }

/* 격자 공통 */
.board { display: grid; gap: 2px; user-select: none; touch-action: none; }
.cell { background: var(--bg3); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.poly-prev { position: relative; }
.poly-prev div { position: absolute; border-radius: 2px; }
.tray { display: flex; flex-wrap: wrap; gap: 10px; }
.tray .piece { padding: 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--bg3); }
.tray .piece.sel { border-color: var(--gold); }
.tray .piece.used { opacity: .25; }

</style>
</head>

// 다국어 (한국어 / English / 中文)
// t('키', {값}) 으로 현재 언어의 문장을 가져옵니다. 없는 키는 한국어 → 키 이름 순으로 대신 씁니다.
// 게임 파일은 I18N.add({ ko: {...}, en: {...}, zh: {...} }) 로 자기 문장을 추가합니다.
// 온라인에서 방장이 보내는 정보에는 문장을 넣지 않고(키·숫자만), 각자 화면에서 자기 언어로 바꿉니다.
const I18N = (() => {
  const LANGS = [['ko', '한국어'], ['en', 'English'], ['zh', '中文']];
  const STR = { ko: {}, en: {}, zh: {} };
  let lang = (() => {
    try { const s = localStorage.getItem('dp3-lang'); if (s && STR[s]) return s; } catch (e) {}
    const n = (navigator.language || '').toLowerCase();
    return n.startsWith('ko') ? 'ko' : n.startsWith('zh') ? 'zh' : 'en';
  })();
  document.documentElement.lang = lang;
  const listeners = [];
  return {
    LANGS,
    get lang() { return lang; },
    set(l) {
      if (!STR[l] || l === lang) return;
      lang = l; document.documentElement.lang = l;
      try { localStorage.setItem('dp3-lang', l); } catch (e) {}
      listeners.forEach((f) => f(l));
    },
    onChange(f) { listeners.push(f); },
    add(dict) { for (const l in dict) Object.assign(STR[l] = STR[l] || {}, dict[l]); },
    t(key, p) {
      let s = STR[lang][key];
      if (s == null) s = STR.ko[key];
      if (s == null) return key;
      if (p) s = s.replace(/\{(\w+)\}/g, (m, k) => (p[k] != null ? p[k] : m));
      return s;
    },
    // {ko, en, zh} 객체 또는 문자열에서 현재 언어 값 고르기
    pick(x) { return x == null ? '' : typeof x === 'string' ? x : (x[lang] != null ? x[lang] : x.ko); },
  };
})();
// 전역 이름 T / L (지역 변수 t 와 겹치지 않도록 대문자)
const T = (k, p) => I18N.t(k, p);

// 공용 유틸리티
// 화면에 보이는 버전. 업데이트할 때마다 올려서, 서로 같은 버전인지 대기실에서 확인할 수 있게 합니다.
const APP_VERSION = 'v8';
const U = {
  rnd: (n) => Math.floor(Math.random() * n),
  rint: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: (a) => a[Math.floor(Math.random() * a.length)],
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  range: (n) => Array.from({ length: n }, (_, i) => i),
  sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
  fmt: (n) => n.toLocaleString('ko-KR'),
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
};

// DOM 생성 헬퍼
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}

// 사람 입력 대기: 버튼 목록을 표시하고 클릭된 값을 반환
function choose(container, options) {
  return new Promise((resolve) => {
    container.innerHTML = '';
    for (const o of options) {
      container.append(
        h('button', {
          class: 'btn ' + (o.cls || ''),
          disabled: o.disabled,
          onclick: () => { container.innerHTML = ''; resolve(o.value); },
        }, o.label)
      );
    }
  });
}

// 폴리오미노 도구
const Poly = {
  normalize(cells) {
    const minR = Math.min(...cells.map((c) => c[0]));
    const minC = Math.min(...cells.map((c) => c[1]));
    return cells.map(([r, c]) => [r - minR, c - minC]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  },
  rotate(cells) { return Poly.normalize(cells.map(([r, c]) => [c, -r])); },
  flip(cells) { return Poly.normalize(cells.map(([r, c]) => [r, -c])); },
  key(cells) { return cells.map((c) => c.join(',')).join(';'); },
  orientations(cells) {
    const out = [], seen = new Set();
    let cur = Poly.normalize(cells);
    for (let f = 0; f < 2; f++) {
      for (let i = 0; i < 4; i++) {
        const k = Poly.key(cur);
        if (!seen.has(k)) { seen.add(k); out.push(cur); }
        cur = Poly.rotate(cur);
      }
      cur = Poly.flip(cur);
    }
    return out;
  },
  size(cells) {
    return [Math.max(...cells.map((c) => c[0])) + 1, Math.max(...cells.map((c) => c[1])) + 1];
  },
  // 미니 미리보기 요소
  preview(cells, color, unit = 14) {
    const [hR, wC] = Poly.size(cells);
    const box = h('div', { class: 'poly-prev', style: { width: wC * unit + 'px', height: hR * unit + 'px' } });
    for (const [r, c] of cells) {
      box.append(h('div', { style: { left: c * unit + 'px', top: r * unit + 'px', width: unit - 2 + 'px', height: unit - 2 + 'px', background: color } }));
    }
    return box;
  },
};

// 트럼프 카드 & 포커 족보
const Cards = {
  suits: ['♠', '♥', '♦', '♣'],
  rankName: (r) => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[r] || String(r)),
  deck() {
    const d = [];
    for (const s of Cards.suits) for (let r = 2; r <= 14; r++) d.push({ r, s });
    return d;
  },
  el(card, faceUp = true, extra = '') {
    if (!faceUp) return h('div', { class: 'pcard back ' + extra });
    const red = card.s === '♥' || card.s === '♦';
    return h('div', { class: 'pcard ' + (red ? 'red ' : '') + extra }, h('b', {}, Cards.rankName(card.r)), h('span', {}, card.s));
  },
  // 5장 평가: [카테고리, 타이브레이커...]
  eval5(cards) {
    const rs = cards.map((c) => c.r).sort((a, b) => b - a);
    const flush = cards.every((c) => c.s === cards[0].s);
    const uniq = [...new Set(rs)];
    let straightHigh = 0;
    if (uniq.length === 5) {
      if (rs[0] - rs[4] === 4) straightHigh = rs[0];
      else if (rs.join() === '14,5,4,3,2') straightHigh = 5;
    }
    const cnt = {};
    rs.forEach((r) => (cnt[r] = (cnt[r] || 0) + 1));
    const groups = Object.entries(cnt).map(([r, n]) => [n, +r]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const byGroup = groups.map((g) => g[1]);
    if (straightHigh && flush) return [straightHigh === 14 ? 9 : 8, straightHigh];
    if (groups[0][0] === 4) return [7, ...byGroup];
    if (groups[0][0] === 3 && groups[1][0] === 2) return [6, ...byGroup];
    if (flush) return [5, ...rs];
    if (straightHigh) return [4, straightHigh];
    if (groups[0][0] === 3) return [3, ...byGroup];
    if (groups[0][0] === 2 && groups[1][0] === 2) return [2, ...byGroup];
    if (groups[0][0] === 2) return [1, ...byGroup];
    return [0, ...rs];
  },
  catName: ['하이카드', '원페어', '투페어', '트리플', '스트레이트', '플러시', '풀하우스', '포카드', '스트레이트 플러시', '로열 플러시'],
  cmp(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (d) return d;
    }
    return 0;
  },
};

// 간단한 타이머
function makeTimer(seconds, onTick, onEnd) {
  let left = seconds, id = null;
  const t = {
    get left() { return left; },
    start() {
      onTick(left);
      id = setInterval(() => {
        left--;
        onTick(left);
        if (left <= 0) { t.stop(); onEnd && onEnd(); }
      }, 1000);
      return t;
    },
    stop() { if (id) clearInterval(id); id = null; },
  };
  return t;
}

// 게임 UI 공용 조각
const UIx = {
  secs: (deadline, now) => Math.max(0, Math.ceil((deadline - now) / 1000)),
  mmss(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; },
  // [{name, value, me, sub}]
  scoreboard(list) {
    return h('div', { class: 'scores' }, ...list.map((x) => h('div', { class: 'stat' + (x.me ? ' me' : '') }, h('b', {}, x.value), h('span', {}, x.name + (x.sub ? ' ' + x.sub : '')))));
  },
  // 메시지 번호가 바뀌면 토스트
  msgWatcher(ctx) {
    const last = {}; // 자리별 마지막 메시지 번호
    return (m, me) => {
      const n = m ? m.n : 0;
      if (!(me in last)) { last[me] = n; return; }
      if (n !== last[me]) { last[me] = n; if (m) ctx.toast(m.key ? T(m.key, m.p) : m.text); }
    };
  },
  rankBy(seats, keyFn) {
    // keyFn이 작은 순 = 높은 순위. 같은 값은 같은 순위
    const order = seats.slice().sort((a, b) => keyFn(a) - keyFn(b));
    let rank = 0, prev = null;
    return order.map((s, i) => { const k = keyFn(s); if (k !== prev) { rank = i + 1; prev = k; } return { seat: s, rank }; });
  },
};

// 게임 진행 엔진 실행기 (오프라인 · 온라인 호스트 공용)
//
// 각 게임은 engine 객체를 제공합니다.
//   setup(seats, opts)            → state      seats: [{name, bot}], opts: {...게임옵션, local, now}

//   active(state)                 → 지금 입력을 기다리는 자리 목록

//   view(state, seat)             → 그 자리에서 보이는 정보 (seat = -1 은 관전자)
//   tick(state, now)              → 시간 경과 처리, 바뀌었으면 true

class GameHost {
  constructor(def, seats, opts) {
    this.def = def;
    this.E = def.engine;
    this.seats = seats; // [{name, bot, conn, local}]
    this.opts = opts;
    this.botTimers = new Map();
    this.listeners = [];
    this.dead = false;
    this.reset();
    this.tickId = setInterval(() => this.tick(), 250);
  }
  reset() {
    for (const t of this.botTimers.values()) clearTimeout(t);
    this.botTimers.clear();
    this.state = this.E.setup(this.seats.map((s) => ({ name: s.name, bot: s.bot })), { ...this.opts, now: Date.now() });
    this.changed();
  }
  act(seat, a) {
    if (this.dead || this.E.over(this.state)) return;
    let r;
    try { r = this.E.action(this.state, seat, a, Date.now()); } catch (e) { console.error(e); return; }
    if (r === false) return;
    this.changed();
  }
  tick() {
    if (this.dead || this.E.over(this.state) || !this.E.tick) return;
    let r = false;
    try { r = this.E.tick(this.state, Date.now()); } catch (e) { console.error(e); }
    if (r) this.changed();
  }
  changed() {
    this.scheduleBots();
    this.broadcast();
  }
  scheduleBots() {
    if (this.E.over(this.state)) return;
    for (const s of this.E.active(this.state)) {
      if (!this.seats[s] || !this.seats[s].bot || this.botTimers.has(s)) continue;
      const delay = this.E.botDelay ? this.E.botDelay(this.state, s) : 700;
      this.botTimers.set(s, setTimeout(() => {
        this.botTimers.delete(s);
        if (this.dead || this.E.over(this.state) || !this.E.active(this.state).includes(s)) return;
        let a = null;

    v.names = this.seats.map((s) => s.name);
    v.bots = this.seats.map((s) => !!s.bot);
    v.result = this.E.over(this.state) || null;
    return v;
  }
  broadcast() {
    const now = Date.now();
    this.seats.forEach((s, i) => {
      if (s.conn && s.conn.open) {
        try { s.conn.send({ type: 'view', view: this.viewFor(i), hostNow: now }); } catch (e) { console.error(e); }
      }
    });
    this.listeners.forEach((f) => f());
  }
  // 온라인 플레이어가 나가면 봇이 이어받음
  seatToBot(i) {
    const s = this.seats[i];
    s.bot = true; s.conn = null;
    s.name += ' 🤖';
    this.changed();
  }
  destroy() {
    this.dead = true;
    clearInterval(this.tickId);
    for (const t of this.botTimers.values()) clearTimeout(t);
  }
}

// 인원 수 → 실제 자리 수 (봇으로 채움)
function seatCount(def, humans) {
  const p = def.players;
  if (humans <= 1) return p.soloSeats || 1;
  return Math.max(humans, p.minSeats || 1);
}
// 봇 이름은 온라인에서 모두에게 똑같이 보이므로 언어와 상관없는 모양으로
function botName(i) { return '🤖 ' + (i + 1); }

// 공개 MQTT 중계 서버(WebSocket)를 "방(room)" 모양의 API로 감쌉니다.
// 기기끼리 직접 연결(WebRTC)하지 않고 서버를 거쳐 주고받으므로,
// 기기 간 통신을 막는 와이파이나 휴대폰 데이터에서도 웹페이지만 열리면 연결됩니다.
//
// 중계 서버 여러 곳에 "동시에" 연결해 모든 곳으로 보내고 모든 곳에서 받습니다.
// 그래서 어떤 기기가 한 서버에 못 붙더라도, 공통으로 붙은 서버가 하나만 있으면 서로 보입니다.
// (같은 메시지가 여러 번 와도 위쪽 전송층이 순번으로 걸러 냅니다.)
// 반환: { presence, peers, onPeers, emit, on, join, connected }
const MqttRoom = (() => {
  const BROKERS = [
    { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'Mosquitto', url: 'wss://test.mosquitto.org:8081' },
  ];
  const BASE = 'devilsgr3v1/';
  // 휴대폰에서 잠깐 다른 앱을 보거나 백그라운드 탭이 느려져도 끊기지 않도록 넉넉하게
  const BEAT_MS = 2000, EXPIRE_MS = 45000;
  let apiP = null, conns = [];

  async function create() {
    const subs = new Set();
    const rooms = new Map();
    const me = Math.random().toString(36).slice(2, 14).replace(/[^a-z0-9]/g, 'x');
    conns = BROKERS.map((b) => ({
      ...b,
      c: mqtt.connect(b.url, { clientId: 'dg3_' + Math.random().toString(36).slice(2, 12), clean: true, keepalive: 30, connectTimeout: 8000, reconnectPeriod: 3000 }),
    }));
    const publishAll = (topic, payload, retain = false) => {
      const live = conns.filter((x) => x.c.connected);
      return Promise.all(live.map((x) => new Promise((res) => x.c.publish(topic, payload, { qos: retain ? 1 : 0, retain }, () => res()))));
    };
    const subscribeAll = (filter) => { subs.add(filter); conns.forEach((x) => x.c.connected && x.c.subscribe(filter, { qos: 0 })); };
    const unsubscribeAll = (filter) => { subs.delete(filter); conns.forEach((x) => x.c.connected && x.c.unsubscribe(filter)); };
    const beatAll = () => { for (const r of rooms.values()) publishAll(`${BASE}${r.name}/p`, JSON.stringify({ from: me, pres: r.pres })); };

    function onMessage(t, buf) {
      if (!t.startsWith(BASE)) return;
      const rest = t.slice(BASE.length);
      const i = rest.indexOf('/');
      if (i < 0) return;
      const r = rooms.get(rest.slice(0, i));
      if (!r) return;
      const sub = rest.slice(i + 1);
      if (sub.startsWith('keep/')) { // 서버에 남겨 두는 표시 (빈 내용 = 지움)
        let v = null; if (buf.length) { try { v = JSON.parse(buf.toString()); } catch (e) { return; } }
        r.kept[sub.slice(5)] = v;
        return;
      }
      let msg; try { msg = JSON.parse(buf.toString()); } catch (e) { return; }
      r.onMessage(sub, msg);
    }
    for (const x of conns) {
      x.c.on('connect', () => { subs.forEach((s) => x.c.subscribe(s, { qos: 0 })); setTimeout(beatAll, 300); });
      x.c.on('message', onMessage);

    await new Promise((resolve, reject) => {
      let done = false;
      const finish = (ok) => { if (done) return; done = true; clearTimeout(t); ok ? resolve() : reject({ type: 'network' }); };
      const t = setTimeout(() => finish(conns.some((x) => x.c.connected)), 9000);
      conns.forEach((x) => x.c.once('connect', () => setTimeout(() => finish(true), 1500)));
    }).catch((e) => { conns.forEach((x) => x.c.end(true)); conns = []; throw e; });

    function makeRoom(name) {
      const topic = BASE + name;
      const r = { name, pres: {}, peers: new Map(), topicLs: {}, peerLs: [], snap: Object.freeze([]), left: false, kept: {} };
      const pub = (sub, obj) => publishAll(`${topic}/${sub}`, JSON.stringify(obj));
      function rebuild(joined = [], left = []) {
        const now = Date.now();
        for (const [p, v] of r.peers) if (now - v.seen > EXPIRE_MS) { r.peers.delete(p); left.push({ peer: p }); }
        const list = [{ peer: me, sameTab: true, isMe: true, by: null, kind: 'viewer', guest: false, presence: r.pres, updatedAt: now },
          ...[...r.peers].map(([p, v]) => ({ peer: p, sameTab: false, isMe: false, by: null, kind: 'viewer', guest: false, presence: v.pres, updatedAt: v.seen }))];
        r.snap = Object.freeze(list);
        const ch = { peers: r.snap, joined, left, updated: [] };
        r.peerLs.forEach((f) => { try { f(ch); } catch (e) { console.error(e); } });
      }
      r.onMessage = (sub, msg) => {
        if (!msg || msg.from === me) return;
        if (sub === 'p') {
          const isNew = !r.peers.has(msg.from);
          r.peers.set(msg.from, { pres: msg.pres || {}, seen: Date.now() });
          if (isNew) rebuild([{ peer: msg.from }], []); else rebuild();
        } else if (sub === 'l') {
          if (r.peers.delete(msg.from)) rebuild([], [{ peer: msg.from }]);
        } else if (sub.startsWith('m/')) {
          const t = sub.slice(2);
          (r.topicLs[t] || []).forEach((f) => { try { f({ topic: t, data: msg.data, peer: msg.from, sameTab: false, isMe: false, by: null, kind: 'viewer', guest: false }); } catch (e) { console.error(e); } });
        }
      };
      r.beat = setInterval(() => { pub('p', { from: me, pres: r.pres }); rebuild(); }, BEAT_MS);
      subscribeAll(topic + '/#');
      pub('p', { from: me, pres: r.pres });
      setTimeout(() => rebuild(), 0);
      r.api = {
        name,
        emit: (t, data) => pub('m/' + t, { from: me, data }),
        on(t, f) { (r.topicLs[t] = r.topicLs[t] || []).push(f); return () => { r.topicLs[t] = (r.topicLs[t] || []).filter((x) => x !== f); }; },
        presence(patch) {
          const next = { ...r.pres };
          for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
          r.pres = next;
          rebuild();
          return pub('p', { from: me, pres: r.pres });
        },
        peers: () => r.snap,
        // keep: 서버에 남겨 두는 표시. 나중에 들어온 사람도, 내 화면이 잠시 멈춰 있어도 바로 보입니다.
        keep: (key, value) => publishAll(`${topic}/keep/${key}`, value == null ? '' : JSON.stringify(value), true),
        kept: (key) => r.kept[key] || null,
        onPeers(f) { r.peerLs.push(f); setTimeout(() => rebuild(), 0); return () => { r.peerLs = r.peerLs.filter((x) => x !== f); }; },
        connected: () => conns.some((x) => x.c.connected),
        leave() {
          if (r.left) return Promise.resolve();
          r.left = true; clearInterval(r.beat);
          const p = pub('l', { from: me });
          unsubscribeAll(topic + '/#');
          rooms.delete(name);
          return p;
        },
      };
      return r;
    }

    const lobbyRoom = makeRoom('lobby');
    rooms.set('lobby', lobbyRoom);
    const lobby = Object.assign({}, lobbyRoom.api, {
      async join(name) {
        if (rooms.has(name)) return rooms.get(name).api;
        const r = makeRoom(name); rooms.set(name, r);
        return r.api;
      },
    });
    window.addEventListener('pagehide', () => { for (const r of rooms.values()) r.api.leave(); });
    // 화면으로 돌아오면 바로 "나 여기 있어요"를 다시 알림
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') beatAll(); });
    return lobby;
  }

  return {
    available: () => typeof mqtt !== 'undefined',
    // 처음 부를 때만 서버에 연결 (오프라인으로만 노는 사람은 연결하지 않음)
    get() { if (!apiP) apiP = create().catch((e) => { apiP = null; throw e; }); return apiP; },
    // 대기 화면 표시용: [{name, ok}]
    status: () => conns.map((x) => ({ name: x.name, ok: x.c.connected })),
  };
})();

// 온라인 방 (방장 = 게임 진행 담당, 참가자 = 화면만 받음)
//
// 모든 메시지는 공개 MQTT 중계 서버(js/mqttroom.js)를 거칩니다. 기기끼리 직접 연결하지 않으므로
// 와이파이 종류와 상관없이 웹페이지만 열리면 연결됩니다.
// 연결(conn)은 { open, send(msg), close(), on('open'|'data'|'close', fn) } 모양입니다.
const Net = (() => {
  const CODE_CHARS = '0123456789';
  const randomCode = () => U.range(5).map(() => CODE_CHARS[U.rnd(CODE_CHARS.length)]).join('');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // 중계 서버 연결 (처음 온라인을 고를 때 한 번 연결)
  function roomApi() {
    if (typeof MqttRoom === 'undefined' || !MqttRoom.available()) return Promise.reject({ type: 'no-lib' });
    return MqttRoom.get(); // 실패하면 { type: 'network' }
  }
  let status = () => {};   // 대기 화면에 연결 단계를 보여 주는 함수
  const setStatus = (f) => { status = f || (() => {}); };

  // 간단한 이벤트 도우미
  function emitter(obj) {
    const ls = {};
    obj.on = (e, f) => { (ls[e] = ls[e] || []).push(f); return obj; };
    obj._fire = (e, v) => (ls[e] || []).slice().forEach((f) => { try { f(v); } catch (err) { console.error(err); } });
    return obj;
  }

  // ================= 전송층 =================
  // 같은 이름방 안에서 1:1 링크를 만들고, 메시지를 잘게 나눠 순서대로·확인 응답과 재전송으로 보냅니다.
  const CHUNK = 3000, WINDOW = 6, RESEND_MS = 1200, GIVE_UP_MS = 60000;
  const asciiJson = (v) => JSON.stringify(v).replace(/[\u007f-￿]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));

  class RoomLink {
    constructor(ep, remote) {
      emitter(this);
      this.ep = ep; this.remote = remote; this.open = false; this.closed = false;
      this.outSeq = 0; this.unacked = new Map(); this.queue = [];
      this.inNext = 1; this.inBuf = new Map(); this.parts = [];
      this.timer = setInterval(() => this.resend(), RESEND_MS / 2);
    }
    send(msg) {
      if (this.closed) return;
      const s = asciiJson(msg);
      for (let i = 0; i < s.length || i === 0; i += CHUNK) this.queue.push({ p: s.slice(i, i + CHUNK), e: i + CHUNK >= s.length ? 1 : 0 });
      this.pump();
    }
    pump() {
      while (this.queue.length && this.unacked.size < WINDOW) {
        const c = this.queue.shift(); const s = ++this.outSeq;
        const pkt = { to: this.remote, k: 'd', s, p: c.p, e: c.e };
        this.unacked.set(s, { pkt, at: Date.now(), first: Date.now() });
        this.ep.raw(pkt);
      }
    }
    resend() {
      const now = Date.now();
      for (const u of this.unacked.values()) {
        if (now - u.at < RESEND_MS) continue;
        // 1분 동안 한 번도 확인 응답이 없을 때만 끊긴 것으로 봄
        if (now - u.first > GIVE_UP_MS) { this.markClosed(); return; }
        u.at = now; this.ep.raw(u.pkt);

    onPacket(d) {
      if (d.k === 'a') { this.unacked.delete(d.s); this.pump(); return; }
      if (d.k !== 'd') return;
      this.ep.raw({ to: this.remote, k: 'a', s: d.s });
      if (d.s < this.inNext || this.inBuf.has(d.s)) return;
      this.inBuf.set(d.s, d);
      while (this.inBuf.has(this.inNext)) {

        if (x.e) { const txt = this.parts.join(''); this.parts = []; let v; try { v = JSON.parse(txt); } catch (e) { continue; } this._fire('data', v); }

      if (this.closed) return;

      this.ep.links.delete(this.remote);
      this._fire('close');

  }

    static async open(name) {

      try { named = await room.join(name); } catch (e) { throw { type: 'network' }; }
      const ep = new RoomEndpoint(named);
      for (let i = 0; i < 50 && !ep.me; i++) { ep.findMe(); if (!ep.me) await sleep(100); }
      if (!ep.me) { ep.destroy(); throw { type: 'network' }; }

    }
    constructor(named) {
      emitter(this);
      this.r = named; this.links = new Map(); this.me = null;
      this.unsubs = [
        named.on('m', (msg) => this.onMsg(msg)),
        named.onPeers((ch) => { this.findMe(); for (const p of ch.left) { const l = this.links.get(p.peer); if (l) l.markClosed(); } this._fire('peers', ch.peers); }),
      ];
    }
    findMe() { const p = this.r.peers().find((x) => x.sameTab); if (p) this.me = p.peer; }
    raw(pkt) {
      this.r.emit('m', pkt).catch(() => {});
    }
    onMsg(msg) {
      if (msg.sameTab) return;
      const d = msg.data;
      if (!d || typeof d !== 'object' || d.to !== this.me) return;
      const from = msg.peer;
      if (d.k === 'hello' || d.k === 'welcome') { this._fire(d.k, from); return; }
      const l = this.links.get(from);
      if (!l) return;
      if (d.k === 'bye') l.markClosed(); else l.onPacket(d);
    }
    link(remote) { let l = this.links.get(remote); if (!l) { l = new RoomLink(this, remote); this.links.set(remote, l); } return l; }
    peers() { return this.r.peers(); }
    destroy() {
      for (const l of [...this.links.values()]) l.close();
      this.unsubs.forEach((u) => { try { u(); } catch (e) {} });
      this.r.leave().catch(() => {});
    }
  }

  // 방장: 이름방에 들어가 "방장" 표시를 하고, 인사(hello)를 받으면 링크를 엽니다.
  const HOST_MARK_TTL = 3 * 3600 * 1000; // 이보다 오래된 방장 표시는 무시
  const freshMark = (ep) => { const m = ep.r.kept && ep.r.kept('host'); return m && m.peer && Date.now() - m.at < HOST_MARK_TTL ? m : null; };

  async function roomListen(name) {

    const mark = freshMark(ep);

    if (ep.r.keep) await ep.r.keep('host', { peer: ep.me, at: Date.now() }).catch(() => {});

  // timeout: 방장이 응답할 때까지 기다리는 최대 시간 (방장 화면이 잠시 꺼져 있을 수 있어 넉넉하게)
  async function roomConnect(name, timeout = 60000) {
    const ep = await RoomEndpoint.open(name);

    let host = null;
    while (!host && Date.now() - t0 < Math.min(timeout, 10000)) {

      const mark = freshMark(ep);

    }

    const ok = await new Promise((resolve) => {
      let done = false, nudged = false;
      ep.on('welcome', (from) => { if (from === host && !done) { done = true; resolve(true); } });
      (async () => {
        while (!done && Date.now() - t0 < timeout) {

          const p = ep.peers().find((x) => !x.sameTab && x.presence && x.presence.h);
          if (p && p.peer !== host) { host = p.peer; }
          ep.raw({ to: host, k: 'hello' });
          if (!nudged && Date.now() - t0 > 8000) { nudged = true; status(T('net.s3nudge')); }
          await sleep(900);
        }
        if (!done) { done = true; resolve(false); }
      })();
    });
    if (!ok) { ep.destroy(); throw { type: 'host-asleep' }; }
    l.markOpen();
    l.on('close', () => setTimeout(() => ep.destroy(), 100));
    return { conn: l, destroy: () => ep.destroy() };
  }

  const listen = (name) => roomListen(name.toLowerCase());
  const connect = (name, timeout) => roomConnect(name.toLowerCase(), timeout);

  // ================= 방 =================
  class RoomHost {
    constructor(server, { def, cap, opts, name, code, isPublic, fill = true }) {
      this.server = server; this.def = def; this.cap = cap; this.opts = opts; this.code = code; this.isPublic = isPublic; this.fill = fill;
      this.members = [{ name, conn: null }];
      this.game = null;
      this.onLobby = () => {}; this.onStart = () => {}; this.onToast = () => {}; this.onStarted = () => {};
      server.on('connection', (conn) => {
        conn.on('data', (msg) => this.onMsg(conn, msg));
        conn.on('close', () => this.onClose(conn));
        conn.on('error', () => this.onClose(conn));
      });
    }
    lobbyMsg() { return { type: 'lobby', game: this.def.id, cap: this.cap, opts: this.opts, members: this.members.map((m) => m.name), code: this.code, isPublic: this.isPublic, fill: this.fill }; }
    broadcastLobby() {
      const m = this.lobbyMsg();
      for (const x of this.members) if (x.conn && x.conn.open) x.conn.send(m);
      this.onLobby(m);
    }
    onMsg(conn, msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'join') {
        if (this.members.some((m) => m.conn === conn)) return;
        if (this.game) return this.reject(conn, 'started');
        if (this.members.length >= this.cap) return this.reject(conn, 'full');
        let name = String(msg.name || 'Player').slice(0, 12);
        while (this.members.some((m) => m.name === name)) name += "'";
        this.members.push({ name, conn });
        this.broadcastLobby();
        if (this.isPublic && this.members.length >= this.cap) setTimeout(() => this.start(), 600);
      } else if (msg.type === 'act' && this.game) {
        const i = this.game.seats.findIndex((s) => s.conn === conn);
        if (i >= 0) this.game.act(i, msg.act);
      }
    }
    reject(conn, reason) { conn.send({ type: 'reject', reason }); setTimeout(() => conn.close(), 1500); }
    onClose(conn) {
      if (this.game) {
        const i = this.game.seats.findIndex((s) => s.conn === conn);
        if (i >= 0 && !this.game.seats[i].bot) { this.onToast(T('net.leftBot', { name: this.game.seats[i].name })); this.game.seatToBot(i); }
        return;
      }
      const k = this.members.findIndex((m) => m.conn === conn);
      if (k > 0) { this.members.splice(k, 1); this.broadcastLobby(); }
    }
    start() {
      if (this.game) return;
      const minSeats = this.def.players.minSeats || 1;
      if (!this.fill && this.members.length < Math.max(2, minSeats)) return;
      const seats = this.members.map((m) => ({ name: m.name, bot: false, conn: m.conn, local: !m.conn }));
      const total = this.fill ? Math.max(this.cap, minSeats, seats.length) : seats.length;
      for (let i = seats.length, b = 0; i < total; i++, b++) seats.push({ name: botName(b), bot: true, conn: null });
      if (this.server.hide) this.server.hide(); // 시작했으니 더 이상 방을 찾을 수 없게
      this.game = new GameHost(this.def, seats, { ...this.opts, local: false });
      seats.forEach((s, i) => { if (s.conn && s.conn.open) s.conn.send({ type: 'start', game: this.def.id, seat: i }); });
      this.onStarted();
      this.onStart(this.game);
      this.game.broadcast();
    }
    destroy() { this.dead = true; if (this.game) this.game.destroy(); this.onStarted(); try { this.server.destroy(); } catch (e) {} }
  }

  async function createRoom(def, cap, opts, name, fill = true) {
    for (let i = 0; i < 6; i++) {
      const code = randomCode();
      try { return new RoomHost(await listen('r-' + code), { def, cap, opts, name, code, isPublic: false, fill }); }
      catch (e) { if (e.type !== 'unavailable-id') throw e; }
    }
    throw { type: 'fail' };
  }

  class RoomClient {
    constructor() { this.conn = null; this.offset = 0; this.link = null; this.onLobby = () => {}; this.onStart = () => {}; this.onView = () => {}; this.onClose = () => {}; }
    async join(roomName, name, connectTimeout = 60000) {
      this.link = await connect(roomName, connectTimeout);
      const conn = (this.conn = this.link.conn);
      return new Promise((resolve, reject) => {
        let settled = false;
        const done = (fn, v) => { if (!settled) { settled = true; clearTimeout(t); fn(v); } };
        const t = setTimeout(() => done(reject, { type: 'timeout' }), 20000);
        conn.on('data', (msg) => {
          if (!msg || typeof msg !== 'object') return;
          if (msg.type === 'reject') { done(reject, { type: 'rejected', reason: msg.reason }); return; }
          if (msg.type === 'lobby') { done(resolve, msg); this.onLobby(msg); }
          else if (msg.type === 'start') this.onStart(msg);
          else if (msg.type === 'view') { this.offset = msg.hostNow - Date.now(); this.onView(msg.view); }
        });
        conn.on('close', () => { if (settled) this.onClose(); else done(reject, { type: 'closed' }); });
        conn.send({ type: 'join', name });
      });
    }
    send(act) { if (this.conn && this.conn.open) this.conn.send({ type: 'act', act }); }
    destroy() { try { this.link && this.link.destroy(); } catch (e) {} }
  }

  async function joinRoom(code, name) {
    const c = new RoomClient();
    try { const lobby = await c.join('r-' + code.replace(/\D/g, ''), name); return { client: c, lobby }; }
    catch (e) { c.destroy(); throw e; }
  }

  // ---------- 랜덤 매칭 ----------
  const matchKey = (def, cap, opts) => [def.id, cap, ...Object.keys(opts).sort().map((k) => opts[k])].join('-').replace(/[^A-Za-z0-9-]/g, '').toLowerCase();

  // 대기 중인 사람끼리 presence로 서로를 보고, 가장 먼저 찾기 시작한 사람이 방장이 됨
  async function quickMatch(def, cap, opts, name, onStatus, isCancelled, fill = true) {
    onStatus && onStatus(T('net.s1'));
    const lobby = await roomApi();
    const key = matchKey(def, cap, opts);
    const since = Date.now();
    await lobby.presence({ q: key, since }).catch(() => {});
    const clear = () => lobby.presence({ q: null, since: null }).catch(() => {});
    const searchers = () => lobby.peers().filter((p) => p.presence && p.presence.q === key)
      .sort((a, b) => (a.presence.since - b.presence.since) || (a.peer < b.peer ? -1 : 1));
    onStatus && onStatus(T('net.matchCheck'));
    await sleep(1800); // 다른 사람의 presence가 도착할 시간
    try {
      for (let tries = 0; tries < 240; tries++) {
        if (isCancelled && isCancelled()) throw { type: 'cancelled' };
        const leader = searchers()[0];
        if (!leader) { await sleep(500); continue; }
        const roomName = ('q-' + leader.peer).toLowerCase().replace(/[^a-z0-9_.-]/g, '').slice(0, 48);
        if (leader.sameTab) {
          onStatus && onStatus(T('net.matchWaitOthers'));
          const host = new RoomHost(await roomListen(roomName), { def, cap, opts, name, code: null, isPublic: true, fill });
          host.onStarted = clear;
          // 나보다 먼저 찾기 시작한 사람이 보이고 내 방이 비어 있으면, 방을 접고 그쪽으로 다시 매칭
          const watch = setInterval(() => {
            if (host.game || host.dead) { clearInterval(watch); return; }
            const first = searchers()[0];
            if (first && !first.sameTab && host.members.length === 1) {
              clearInterval(watch);
              host.dead = true;
              try { host.server.destroy(); } catch (e) {}
              host.onDemote && host.onDemote();
            }
          }, 1000);
          return { host };
        }
        onStatus && onStatus(T('net.matchEnter'));
        const c = new RoomClient();
        try { const lb = await c.join(roomName, name, 7000); clear(); return { client: c, lobby: lb }; }
        catch (e) { c.destroy(); await sleep(1500); }
      }
      throw { type: 'fail' };
    } catch (e) { clear(); throw e; }
  }

  function errText(e) {
    if (!e) return T('err.unknown');
    if (e.type === 'rejected') return e.reason ? T('reject.' + e.reason) : T('err.rejected');
    if (['no-lib', 'not-found', 'timeout', 'host-asleep', 'network', 'cancelled', 'fail'].includes(e.type)) return T('err.' + e.type);
    return T('err.other', { m: e.type || e.message || e });
  }

  return { createRoom, joinRoom, quickMatch, errText, roomApi, setStatus };
})();

</script>
  <script>/* js/app.js */
// 게임 레지스트리 · 로비 · 플레이 화면
const GAMES = [];
function registerGame(def) { GAMES.push(def); }

const App = (() => {
  let cleanupFns = [];
  let screen = null; // 언어를 바꿀 때 다시 그릴 화면 { fn, arg }
  const addCleanup = (f) => cleanupFns.push(f);
  function unmount() {
    for (const f of cleanupFns) { try { f(); } catch (e) { console.error(e); } }
    cleanupFns = [];
    closeModal();
    screen = null;
  }
  const root = () => document.getElementById('app');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('dp3-' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('dp3-' + k, v); } catch (e) {} },
  };

  function langPicker() {
    const sel = h('select', { class: 'lang-select', 'aria-label': T('lang'), onchange: (e) => I18N.set(e.target.value) },
      ...I18N.LANGS.map(([k, label]) => h('option', { value: k, selected: k === I18N.lang }, label)));
    return h('label', { class: 'lang-pick' }, h('span', {}, '🌐'), sel);
  }
  I18N.onChange(() => { document.title = T('app.title'); if (screen) screen.fn(screen.arg); });

  // ---------------- 목록 ----------------
  function hub() {
    unmount();
    const r = root(); r.innerHTML = '';
    document.title = T('app.title');
    const row = h('div', { class: 'cards' });
    for (const g of GAMES) row.append(h('button', { class: 'gcard', onclick: () => lobby(g.id) },
      h('div', { class: 'gname' }, L(g.name)),
      h('div', { class: 'gen' }, I18N.lang === 'en' ? '' : g.en || ''),
      h('div', { class: 'gsum' }, L(g.summary)),
      h('div', { class: 'gplayers' }, '👤 ' + (g.players.max > 1 ? T('hub.players', { n: g.players.max }) : T('hub.player1')))));
    r.append(h('header', { class: 'hub-head' },
      h('div', { class: 'logo' }, h('span', { class: 'eye' }, '◉'), ' ' + T('app.title'), h('small', { class: 'ver' }, APP_VERSION)),
      langPicker()), row);
    screen = { fn: hub };
  }

  function topbar(title, onBack, def, withLang) {
    return h('div', { class: 'topbar' },
      h('button', { class: 'btn ghost', onclick: onBack }, onBack === hub ? T('top.back') : T('top.leave')),
      h('div', { class: 'ttl' }, title),
      h('div', { class: 'tb-right' },
        withLang ? langPicker() : null,
        def ? h('button', { class: 'btn ghost', onclick: () => showRules(def) }, T('top.rules')) : null));
  }

  // ---------------- 로비 ----------------
  function lobby(id) {
    const def = GAMES.find((g) => g.id === id);
    if (!def) return hub();
    unmount();
    const r = root(); r.innerHTML = '';
    const P = def.players;
    const minSeats = P.minSeats || 1;
    const opts = {};
    for (const o of def.options || []) opts[o.key] = o.choices.find((c) => String(c[0]) === store.get(`opt-${id}-${o.key}`, ''))?.[0] ?? o.default;

    // 인원 모집 방식: 온라인 / 오프라인 / 봇과 대결 + 부족한 인원 봇으로 채우기
    let mode = store.get('mode-' + id, 'online');
    if (!['online', 'offline', 'bots'].includes(mode)) mode = 'online';
    let fill = store.get('fill', '1') === '1';
    const minBots = Math.max(1, minSeats - 1), maxBots = P.max - 1;
    const cnt = {
      online: U.clamp(+store.get(`n-online-${id}`, Math.max(2, P.default || 2)), 2, P.max),
      offline: U.clamp(+store.get(`n-offline-${id}`, Math.max(2, P.default || 2)), 2, P.max),
      bots: U.clamp(+store.get(`n-bots-${id}`, Math.max(minBots, (P.soloSeats || 2) - 1)), minBots, maxBots),
    };
    const RANGE = { online: [2, P.max], offline: [2, P.max], bots: [minBots, maxBots] };

    const nick = h('input', { type: 'text', maxlength: 12, value: store.get('nick', ''), placeholder: T('lobby.nickname'), style: { width: '160px' } });
    const codeIn = h('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', autocomplete: 'off', maxlength: 5, placeholder: T('lobby.codePh'), style: { width: '190px', letterSpacing: '3px' } });
    codeIn.addEventListener('input', () => { const v = codeIn.value.replace(/\D/g, '').slice(0, 5); if (v !== codeIn.value) codeIn.value = v; });
    const optBox = h('div', { class: 'col' });
    const tabs = h('div', { class: 'mode-tabs' });
    const body = h('div', { class: 'panel col mode-body' });
    const localNames = (() => { try { return JSON.parse(store.get('lnames', '[]')) || []; } catch (e) { return []; } })();
    const small = (txt, cls = 'muted') => h('div', { class: cls, style: { fontSize: '13px' } }, txt);

    function stepper(key, label) {
      const [lo, hi] = RANGE[key];
      const val = h('b', { style: { fontSize: '26px', minWidth: '40px', textAlign: 'center' } }, cnt[key]);
      const set = (d) => { cnt[key] = U.clamp(cnt[key] + d, lo, hi); store.set(`n-${key}-${id}`, cnt[key]); renderBody(); };
      return h('div', { class: 'col', style: { gap: '6px' } },
        h('h4', { style: { margin: 0 } }, label),
        h('div', { class: 'row' }, h('button', { class: 'btn', disabled: cnt[key] <= lo, onclick: () => set(-1) }, '−'), val,
          h('button', { class: 'btn', disabled: cnt[key] >= hi, onclick: () => set(1) }, '+'), h('span', { class: 'muted' }, `(${lo}~${hi})`)));
    }
    function fillToggle() {
      const cb = h('input', { type: 'checkbox', id: 'fill-bots' });
      cb.checked = fill;
      cb.onchange = () => { fill = cb.checked; store.set('fill', fill ? '1' : '0'); renderBody(); };
      return h('label', { class: 'fill-toggle', for: 'fill-bots' }, cb, h('span', {}, T('lobby.fill')));
    }
    function renderTabs() {
      tabs.innerHTML = '';
      for (const k of ['online', 'offline', 'bots']) {
        tabs.append(h('button', { class: 'mode-tab' + (mode === k ? ' on' : ''), onclick: () => { mode = k; store.set('mode-' + id, k); renderTabs(); renderBody(); } }, T('lobby.' + k)));
      }
    }
    const defaultName = (i) => T('lobby.playerN', { n: i + 1 });
    function renderBody() {
      body.innerHTML = '';
      if (mode === 'online') {
        const n = cnt.online;
        const note = fill ? T('lobby.noteFill', { n }) : T('lobby.noteNoFill', { n: Math.max(2, minSeats) });
        body.append(stepper('online', T('lobby.capacity')), fillToggle(), small(note),
          h('div', { class: 'row' }, h('span', { class: 'muted' }, T('lobby.nickname')), nick),
          h('div', { class: 'row' },
            h('button', { class: 'btn primary', onclick: () => goOnline('match') }, T('lobby.match')),
            h('button', { class: 'btn', onclick: () => goOnline('create') }, T('lobby.create'))),
          small(T('lobby.matchNote')),
          h('div', { class: 'row', style: { marginTop: '6px' } }, codeIn, h('button', { class: 'btn', onclick: joinByCode }, T('lobby.join'))));
      } else if (mode === 'offline') {
        const n = cnt.offline;
        const bots = fill ? Math.max(0, minSeats - n) : 0;
        const short = !fill && n < minSeats;
        const names = h('div', { class: 'col' });
        for (let i = 0; i < n; i++) {
          const inp = h('input', { type: 'text', maxlength: 12, value: localNames[i] || defaultName(i), style: { width: '150px' } });
          inp.oninput = () => { localNames[i] = inp.value; store.set('lnames', JSON.stringify(localNames)); };
          names.append(inp);
        }
        const note = short ? T('lobby.minNeeded', { n: minSeats })
          : bots ? T('lobby.botsFill', { b: bots, t: n + bots }) : T('lobby.total', { n });
        body.append(stepper('offline', T('lobby.people')), fillToggle(),
          small(note, short ? 'bad' : 'muted'), small(T('lobby.curtainNote')),
          names,
          h('div', {}, h('button', { class: 'btn primary', disabled: short, onclick: () => startLocal(def, [...names.querySelectorAll('input')].map((x, i) => x.value.trim() || defaultName(i)), bots, opts) }, T('lobby.start'))));
      } else {
        const b = cnt.bots;
        const me = h('input', { type: 'text', maxlength: 12, value: store.get('solo-name', '') || T('lobby.me'), style: { width: '150px' } });
        me.oninput = () => store.set('solo-name', me.value);
        body.append(stepper('bots', T('lobby.botCount')),
          small(T('lobby.meBots', { b, t: b + 1 })),
          h('div', { class: 'row' }, h('span', { class: 'muted' }, T('lobby.name')), me),
          h('div', {}, h('button', { class: 'btn primary', onclick: () => startLocal(def, [me.value.trim() || T('lobby.me')], b, opts) }, T('lobby.start'))));
      }
    }

    for (const o of def.options || []) {
      const row = h('div', { class: 'row' }, h('span', { class: 'muted', style: { minWidth: '70px' } }, L(o.label)));
      const draw = () => {
        row.querySelectorAll('button').forEach((b) => b.remove());
        for (const [v, label] of o.choices) row.append(h('button', { class: 'btn sm' + (opts[o.key] === v ? ' on' : ''), onclick: () => { opts[o.key] = v; store.set(`opt-${id}-${o.key}`, v); draw(); } }, L(label)));
      };
      draw();
      optBox.append(row);
    }

    const getNick = () => { const v = nick.value.trim() || T('lobby.defaultNick'); store.set('nick', v); return v; };

    async function goOnline(kind) {
      const name = getNick();
      const n = cnt.online;
      const wait = waitingScreen(def, T('wait.connecting'));
      let cancelled = false;
      wait.setLeave(() => (cancelled = true));
      try {
        if (kind === 'match') {
          const res = await Net.quickMatch(def, n, { ...opts }, name, wait.status, () => cancelled, fill);
          if (cancelled) { if (res.host) res.host.destroy(); else res.client.destroy(); return; }
          if (res.host) res.host.onDemote = () => { if (!cancelled) goOnline('match'); };
          if (res.host) hostRoom(def, res.host, wait); else clientRoom(res.client, res.lobby, wait);
        } else {
          const host = await Net.createRoom(def, n, { ...opts }, name, fill);
          hostRoom(def, host, wait);
        }
      } catch (e) { console.error(e); if (!cancelled) wait.fail(Net.errText(e)); }
    }
    async function joinByCode() {
      const code = codeIn.value.replace(/\D/g, '');
      if (code.length !== 5) { toast(T('lobby.enterCode')); return; }
      const name = getNick();
      const wait = waitingScreen(def, T('wait.joining', { code }));
      try {
        const { client, lobby: lb } = await Net.joinRoom(code, name);
        clientRoom(client, lb, wait);
      } catch (e) { wait.fail(Net.errText(e)); }
    }
    codeIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinByCode(); });

    r.append(topbar(L(def.name), hub, def, true),
      h('div', { class: 'lobby-wrap' },
        tabs, body,
        (def.options || []).length ? h('div', { class: 'panel col' }, h('h4', {}, T('lobby.settings')), optBox) : null));
    renderTabs();
    renderBody();
    screen = { fn: lobby, arg: id };
    if (!store.get('rules-' + id, '')) { store.set('rules-' + id, '1'); showRules(def); }
  }

  // ---------------- 대기실 ----------------
  function waitingScreen(def, msg) {
    unmount();
    const r = root(); r.innerHTML = '';
    let onLeave = () => {};
    const statusEl = h('div', { class: 'big' }, msg);
    const body = h('div', { class: 'col' });
    const panel = h('div', { class: 'panel col', style: { maxWidth: '560px' } }, statusEl, body);
    r.append(topbar(T('wait.title', { game: L(def.name) }), () => { onLeave(); lobby(def.id); }), panel);
    Net.setStatus((s) => { if (statusEl.isConnected) statusEl.textContent = s; });
    addCleanup(() => Net.setStatus(null));
    // 연결 진단: 버전과 중계 서버 연결 상태 (서로 같은 버전·같은 서버인지 비교용)
    const diag = h('div', { class: 'diag' });
    panel.append(diag);
    const drawDiag = () => {
      const s = typeof MqttRoom !== 'undefined' ? MqttRoom.status() : [];
      diag.textContent = T('wait.diag', { v: APP_VERSION, s: s.length ? s.map((x) => `${x.name} ${x.ok ? '✓' : '✕'}`).join(' · ') : T('wait.diagNone') });
    };
    drawDiag();
    const diagT = setInterval(drawDiag, 1000);
    addCleanup(() => clearInterval(diagT));
    return {
      status: (s) => (statusEl.textContent = s),
      body, statusEl,
      setLeave: (f) => (onLeave = f),
      fail: (s) => { statusEl.innerHTML = ''; statusEl.append(h('span', { class: 'bad' }, s)); body.innerHTML = ''; body.append(h('button', { class: 'btn', onclick: () => lobby(def.id) }, T('wait.back'))); },
    };
  }
  function memberList(m) {
    return h('div', { class: 'col' },
      h('div', { class: 'muted' }, T('wait.members', { n: m.members.length, cap: m.cap })),
      h('div', { class: 'row' }, ...m.members.map((x, i) => h('span', { class: 'chip' }, (i === 0 ? '👑 ' : '') + x))),
      h('div', { class: 'row' }, ...U.range(Math.max(0, m.cap - m.members.length)).map(() => h('span', { class: 'chip empty' }, T('wait.waiting')))));
  }

  function hostRoom(def, host, wait) {
    wait.setLeave(() => host.destroy());
    addCleanup(() => { if (!host.game) host.destroy(); });
    host.onToast = toast;
    host.onLobby = (m) => {
      wait.body.innerHTML = '';
      if (m.code) {
        wait.status(T('wait.created'));
        wait.body.append(h('div', { class: 'muted' }, T('wait.tellCode')),
          h('div', { class: 'room-code', onclick: () => { try { navigator.clipboard.writeText(m.code).then(() => toast(T('wait.copied')), () => {}); } catch (e) {} } }, m.code));
      } else wait.status(T('wait.matchWaiting'));
      const k = m.members.length, need = Math.max(2, def.players.minSeats || 1);
      let label, ok = true;
      if (k >= m.cap) label = T('wait.start');
      else if (m.fill) label = T('wait.startBots', { n: Math.max(m.cap, def.players.minSeats || 1) - k });
      else if (k >= need) label = T('wait.startN', { n: k });
      else { label = T('wait.needMin', { n: need }); ok = false; }
      wait.body.append(memberList(m),
        h('div', { class: 'muted', style: { fontSize: '13px' } }, m.fill ? T('wait.fillOn') : T('wait.fillOff')),
        h('button', { class: 'btn primary', disabled: !ok, onclick: () => host.start() }, label));
    };
    host.onStart = (game) => {
      play(def, { mode: 'host', game, localSeats: [0], onLeave: () => host.destroy(), restart: () => game.reset() });
    };
    host.broadcastLobby();
  }

  function clientRoom(client, lb, wait) {
    let def = GAMES.find((g) => g.id === lb.game);
    if (!def) { wait.fail(T('wait.unknownGame')); client.destroy(); return; }
    wait.setLeave(() => client.destroy());
    let started = false;
    addCleanup(() => { if (!started) client.destroy(); });
    const showLobby = (m) => {
      wait.status(m.code ? T('wait.clientRoom', { code: m.code }) : T('wait.clientMatch'));
      wait.body.innerHTML = '';
      wait.body.append(h('div', { class: 'muted' }, T('wait.info', { game: L(def.name), cap: m.cap, fill: m.fill ? T('wait.infoFill') : T('wait.infoNoFill') })), memberList(m));
    };
    client.onLobby = showLobby;
    client.onClose = () => { if (!started) wait.fail(T('wait.hostClosed')); };
    client.onStart = (msg) => {
      started = true;
      def = GAMES.find((g) => g.id === msg.game) || def;
      play(def, { mode: 'client', client, seat: msg.seat, onLeave: () => client.destroy() });
    };
    showLobby(lb);
  }

  // names: 같은 화면의 사람들, bots: 추가할 봇 수
  function startLocal(def, names, bots, opts) {
    const n = names.length;
    const seats = [...names.map((name) => ({ name, bot: false, local: true })), ...U.range(bots).map((i) => ({ name: botName(i), bot: true }))];
    const game = new GameHost(def, seats, { ...opts, local: true });
    play(def, { mode: 'local', game, localSeats: U.range(n), onLeave: () => game.destroy(), restart: () => game.reset() });
  }

  // ---------------- 플레이 화면 ----------------
  function play(def, cfg) {
    unmount();
    const r = root(); r.innerHTML = '';
    const banner = h('div', { class: 'turn-banner' });
    const stage = h('div', { class: 'stage' });
    const curtain = h('div', { class: 'curtain', style: { display: 'none' } });
    const leave = () => lobby(def.id); // unmount 시 정리 함수가 연결을 끊음
    r.append(topbar(L(def.name), leave, def), banner, stage, curtain);
    banner.style.display = 'none';

    let displaySeat = null, revealedFor = null, resultShown = false;
    const isClient = cfg.mode === 'client';
    const now = () => Date.now() + (isClient ? cfg.client.offset : 0);
    const ctx = {
      send: (a) => { if (isClient) cfg.client.send(a); else if (displaySeat != null && displaySeat >= 0) cfg.game.act(displaySeat, a); },
      now, toast,
      get local() { return cfg.mode === 'local' && cfg.localSeats.length > 1; },
    };
    const ui = def.ui(stage, ctx);
    addCleanup(() => { ui.destroy && ui.destroy(); cfg.onLeave && cfg.onLeave(); });

    function render(view) {
      try { ui.update(view); } catch (e) { console.error(e); }
      if (view.result && !resultShown) { resultShown = true; setTimeout(() => showResult(view), 700); }
      if (!view.result && resultShown) { resultShown = false; closeModal(); }
    }
    function refresh() {
      const game = cfg.game, E = def.engine;
      const locals = cfg.localSeats;
      let seat;
      if (locals.length === 1) seat = locals[0];
      else {
        const A = E.over(game.state) ? [] : E.active(game.state).filter((s) => locals.includes(s));
        if (A.length) {
          seat = A[0];
          if (E.hidden(game.state) && revealedFor !== seat) {
            showCurtain(game.seats[seat].name, () => { revealedFor = seat; refresh(); });
            return;
          }
          if (!E.hidden(game.state)) revealedFor = null;
        } else seat = -1;
        banner.textContent = seat >= 0 ? T('play.turn', { name: game.seats[seat].name }) : '';
        banner.style.display = seat >= 0 ? '' : 'none';
      }
      curtain.style.display = 'none';
      displaySeat = seat;
      render(game.viewFor(seat));
    }
    function showCurtain(name, onOk) {
      curtain.innerHTML = '';
      curtain.style.display = 'flex';
      curtain.append(h('div', { class: 'curtain-box' },
        h('div', { class: 'eye-big' }, '◉'),
        h('div', { class: 'big' }, T('play.curtainTurn', { name })),
        h('div', { class: 'muted' }, T('play.curtainNote')),
        h('button', { class: 'btn primary', onclick: onOk }, T('play.ready'))));
    }
    function showResult(view) {
      const res = view.result;
      const tbl = h('table', { class: 'tbl' }, ...res.ranking.map((x) => h('tr', { class: x.seat === view.me ? 'me' : '' },
        h('td', {}, T('res.rankCol', { n: x.rank })), h('td', {}, view.names[x.seat]), h('td', {}, scoreText(x.score)))));
      const mine = res.ranking.find((x) => x.seat === view.me);
      const title = mine && !ctx.local ? (mine.rank === 1 ? T('res.first') : T('res.rank', { n: mine.rank })) : T('res.over');
      const box = h('div', {}, tbl,
        res.note ? h('p', { class: 'muted' }, T(res.note)) : null,
        isClient ? h('p', { class: 'muted' }, T('res.waitHost')) : null);
      const btns = [];
      if (cfg.restart) btns.push({ label: T('res.again'), fn: () => cfg.restart() });
      else btns.push({ label: T('res.close') });
      btns.push({ label: T('res.leave'), fn: leave });
      modal(title, box, btns);
    }

    if (isClient) {
      displaySeat = cfg.seat;
      cfg.client.onView = (v) => render(v);
      cfg.client.onClose = () => { if (!document.getElementById('modal')) modal(T('res.disconnected'), T('res.disconnectedBody'), [{ label: T('res.leave'), fn: leave }]); };
    } else {
      cfg.game.listeners.push(refresh);
      refresh();
    }
  }

  // ---------------- 공용 ----------------
  function showRules(def) {
    modal(T('rules.title', { game: L(def.name) }), h('div', { class: 'rules', html: L(def.rules) || '' }), [{ label: T('ok') }]);
  }
  function modal(title, body, buttons) {
    closeModal();
    const bg = h('div', { class: 'modal-bg', id: 'modal' });
    const box = h('div', { class: 'modal' },
      h('h3', {}, title),
      typeof body === 'string' ? h('div', {}, body) : body,
      h('div', { class: 'modal-btns' }, ...(buttons || [{ label: T('ok') }]).map((b, i) =>
        h('button', { class: 'btn' + (i === 0 ? ' primary' : ''), onclick: () => { closeModal(); b.fn && b.fn(); } }, b.label))));
    bg.append(box);
    document.body.append(bg);
  }
  function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }
  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) { el = h('div', { id: 'toast' }); document.body.append(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
  return { hub, lobby, toast, modal };
})();

window.addEventListener('DOMContentLoaded', () => App.hub());

  <script>/* js/games/rectangles.js */
// 1일차 메인 · 양자택일 미니게임 — 네모 세기
(() => {
  const N = 7, TIME = 90000, COUNTDOWN = 3000;

  function makePuzzle() {
    for (let tries = 0; tries < 300; tries++) {
      const grid = U.range(N).map(() => U.range(N).map(() => U.rint(1, 9)));
      const sums = {};
      for (let r1 = 0; r1 < N; r1++) for (let c1 = 0; c1 < N; c1++)
        for (let r2 = r1; r2 < N; r2++) for (let c2 = c1; c2 < N; c2++) {
          let s = 0;
          for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) s += grid[r][c];
          (sums[s] = sums[s] || []).push([r1, c1, r2, c2].join(','));
        }
      const cands = Object.entries(sums).filter(([s, l]) => l.length >= 10 && l.length <= 16 && +s >= 12);
      if (cands.length) { const [s, l] = U.pick(cands); return { grid, target: +s, total: l.length }; }
    }
  }
  const rectSum = (g, [r1, c1, r2, c2]) => { let s = 0; for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) s += g[r][c]; return s; };

  const engine = {
    setup(seats, opts) {
      const shared = makePuzzle();
      const st = { local: opts.local, seats, n: seats.length, P: [], found: [], score: [], phase: [], start: [], deadline: [], msg: [], botRate: [] };
      seats.forEach((s, i) => {
        st.P[i] = opts.local && !s.bot ? makePuzzle() : shared;
        st.found[i] = []; st.score[i] = 0; st.msg[i] = null;
        st.botRate[i] = U.rint(55, 90) / 10;
        if (opts.local && !s.bot) st.phase[i] = 'ready';
        else { st.phase[i] = 'play'; st.start[i] = opts.now + COUNTDOWN; st.deadline[i] = st.start[i] + TIME; }
      });
      if (opts.local) seats.forEach((s, i) => { if (s.bot) { st.start[i] = opts.now; st.deadline[i] = opts.now + TIME; } });
      return st;
    },
    action(st, seat, a, now) {
      if (a.t === 'begin') {
        if (st.phase[seat] !== 'ready') return false;
        st.phase[seat] = 'play'; st.start[seat] = now + COUNTDOWN; st.deadline[seat] = st.start[seat] + TIME;
        // 같은 화면 플레이: 봇은 첫 사람과 같이 진행
        return;
      }
      if (a.t === 'rect') {
        if (st.phase[seat] !== 'play' || now < st.start[seat] || now > st.deadline[seat]) return false;
        const rc = [a.r1, a.c1, a.r2, a.c2].map((x) => U.clamp(x | 0, 0, N - 1));
        const key = rc.join(',');
        const s = rectSum(st.P[seat].grid, rc);
        const m = st.msg[seat] ? st.msg[seat].n + 1 : 1;
        // 문장 대신 키를 보냄: 각자 화면에서 자기 언어로 표시
        if (st.found[seat].includes(key)) st.msg[seat] = { n: m, key: 'rect.dup' };
        else if (s === st.P[seat].target) { st.found[seat].push(key); st.score[seat]++; st.msg[seat] = { n: m, key: 'rect.ok' }; }
        else { st.score[seat]--; st.msg[seat] = { n: m, key: 'rect.bad', p: { s } }; }
      }
    },
    tick(st, now) {
      let ch = false;
      st.seats.forEach((s, i) => {
        if (st.phase[i] !== 'play') return;
        if (now > st.deadline[i]) { st.phase[i] = 'done'; ch = true; return; }
        if (s.bot && now >= st.start[i] && Math.random() < 0.25 / st.botRate[i]) { st.score[i] += Math.random() < 0.85 ? 1 : -1; ch = true; }
      });
      return ch;
    },
    active: (st) => U.range(st.n).filter((i) => !st.seats[i].bot && st.phase[i] !== 'done'),
    hidden: () => true,
    view(st, me) {
      const v = { phase: me >= 0 ? st.phase[me] : 'watch', scores: st.score.slice(), done: st.phase.map((p) => p === 'done') };
      if (me >= 0) Object.assign(v, { grid: st.P[me].grid, target: st.P[me].target, total: st.P[me].total, found: st.found[me], start: st.start[me], deadline: st.deadline[me], msg: st.msg[me] });
      return v;
    },
    over(st) {
      if (st.phase.some((p) => p !== 'done')) return null;
      return { ranking: UIx.rankBy(U.range(st.n), (i) => -st.score[i]).map((x) => ({ ...x, score: { k: 'pts', v: st.score[x.seat] } })) };
    },
  };

  function ui(root, ctx) {
    let view = null, sel = null, dragging = false, cells = [], gridKey = null;
    const head = h('div', { class: 'big' });
    const board = h('div', { class: 'board', style: { gridTemplateColumns: `repeat(${N}, 52px)` } });
    const sumEl = h('div', { class: 'muted' }, ' ');
    const timerEl = h('span', { class: 'timer' });
    const foundEl = h('div', { class: 'muted' });
    const scoreBox = h('div');
    const readyBox = h('div', { class: 'col', style: { alignItems: 'center', gap: '14px', padding: '40px 0' } });
    const playBox = h('div', { class: 'col', style: { alignItems: 'center' } }, head, board, sumEl);
    const msg = UIx.msgWatcher(ctx);

    const rectOf = () => { const [a, b] = sel; return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])]; };
    function buildGrid() {
      board.innerHTML = ''; cells = [];
      view.grid.forEach((row, r) => row.forEach((v, c) => {
        const el = h('div', { class: 'cell', style: { height: '52px', fontSize: '20px', cursor: 'pointer' }, 'data-r': r, 'data-c': c }, v);
        cells.push(el); board.append(el);
      }));
    }
    function paint() {
      if (!view || !view.grid) return;
      cells.forEach((el) => (el.style.background = ''));
      for (const k of view.found) { const [r1, c1, r2, c2] = k.split(',').map(Number); for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) cells[r * N + c].style.background = '#22402f'; }
      if (sel) {
        const rc = rectOf();
        for (let r = rc[0]; r <= rc[2]; r++) for (let c = rc[1]; c <= rc[3]; c++) cells[r * N + c].style.background = '#6b2427';
        sumEl.textContent = T('rect.selSum', { s: rectSum(view.grid, rc) });
      } else sumEl.textContent = ' ';
    }
    const cellAt = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.dataset && t.dataset.r != null ? [+t.dataset.r, +t.dataset.c] : null; };
    board.addEventListener('pointerdown', (e) => {
      if (!view || view.phase !== 'play' || ctx.now() < view.start) return;
      const c = cellAt(e); if (!c) return;
      dragging = true; sel = [c, c]; board.releasePointerCapture?.(e.pointerId); paint();
    });
    board.addEventListener('pointermove', (e) => { if (dragging) { const c = cellAt(e); if (c) { sel[1] = c; paint(); } } });
    const up = () => {
      if (!dragging) return; dragging = false;
      const [r1, c1, r2, c2] = rectOf(); sel = null; paint();
      ctx.send({ t: 'rect', r1, c1, r2, c2 });
    };
    document.addEventListener('pointerup', up);

    function tickTimer() {
      if (!view || view.phase !== 'play') { timerEl.textContent = ''; return; }
      const now = ctx.now();
      if (now < view.start) { head.innerHTML = T('play.startIn', { s: `<span class="hl">${UIx.secs(view.start, now)}</span>` }); timerEl.textContent = '1:30'; return; }
      head.innerHTML = T('rect.target', { v: `<span class="hl">${+view.target}</span>` });
      const s = UIx.secs(view.deadline, now);
      timerEl.textContent = UIx.mmss(s); timerEl.classList.toggle('warn', s <= 10);
    }
    const iv = setInterval(tickTimer, 200);

    root.append(h('div', { class: 'split' },
      h('div', {}, readyBox, playBox),
      h('div', { class: 'col' },
        h('div', { class: 'panel row' }, h('span', {}, T('play.timeLeft')), h('span', { style: { flex: 1 } }), timerEl),
        h('div', { class: 'panel' }, foundEl),
        h('div', { class: 'panel col' }, h('h4', {}, T('play.scores')), scoreBox))));

    return {
      update(v) {
        view = v;
        const showPlay = v.phase === 'play' || v.phase === 'done';
        readyBox.style.display = v.phase === 'ready' ? '' : 'none';
        playBox.style.display = showPlay ? '' : 'none';
        if (v.phase === 'ready') {
          readyBox.innerHTML = '';
          readyBox.append(h('div', { class: 'big' }, T('play.readyTitle', { name: v.names[v.me] })), h('div', { class: 'muted' }, T('rect.readyNote')),
            h('button', { class: 'btn primary', onclick: () => ctx.send({ t: 'begin' }) }, T('lobby.start')));
        }
        if (v.phase === 'watch') { readyBox.style.display = ''; readyBox.innerHTML = ''; readyBox.append(h('div', { class: 'muted' }, T('play.waitOthers'))); }
        if (v.grid && v.grid.flat().join() !== gridKey) { gridKey = v.grid.flat().join(); buildGrid(); }
        if (v.phase === 'done') head.textContent = T('rect.doneWait');
        paint(); tickTimer();
        msg(v.msg, v.me);
        foundEl.textContent = v.grid ? T('rect.found', { n: v.found.length, total: v.total }) : '';
        scoreBox.innerHTML = '';
        scoreBox.append(UIx.scoreboard(v.names.map((n, i) => ({ name: n, value: v.scores[i], me: i === v.me, sub: v.done[i] ? '✓' : '' }))));
      },
      destroy() { clearInterval(iv); document.removeEventListener('pointerup', up); },
    };
  }

  I18N.add({
    ko: { 'rect.dup': '이미 찾은 네모예요', 'rect.ok': '정답! +1', 'rect.bad': '합 {s} — 오답 −1', 'rect.selSum': '선택 합: {s}', 'rect.target': '목표 합 {v}',
      'rect.readyNote': '시작을 누르면 3초 뒤 90초가 시작됩니다.', 'rect.doneWait': '종료! 다른 플레이어를 기다리는 중', 'rect.found': '찾은 네모 {n}개 (전체 {total}개 숨어 있음)' },
    en: { 'rect.dup': 'Already found', 'rect.ok': 'Correct! +1', 'rect.bad': 'Sum {s} — wrong −1', 'rect.selSum': 'Selected sum: {s}', 'rect.target': 'Target sum {v}',
      'rect.readyNote': 'Press Start: a 90-second round begins after 3 seconds.', 'rect.doneWait': 'Time! Waiting for other players', 'rect.found': 'Found {n} (of {total} hidden)' },
    zh: { 'rect.dup': '这个已经找到过了', 'rect.ok': '正确！+1', 'rect.bad': '总和 {s} — 错误 −1', 'rect.selSum': '选中总和：{s}', 'rect.target': '目标总和 {v}',
      'rect.readyNote': '点开始后，3秒后进入90秒计时。', 'rect.doneWait': '时间到！等待其他玩家', 'rect.found': '已找到 {n} 个（共藏有 {total} 个）' },
  });

  registerGame({
    id: 'rectangles', en: 'Count the Rectangles',
    name: { ko: '네모 세기', en: 'Count the Rectangles', zh: '数方块' },
    summary: {
      ko: '숫자 판에서 합이 목표 숫자가 되는 네모(직사각형)를 최대한 많이 찾으세요.',
      en: 'Find as many rectangles as you can whose numbers add up to the target.',
      zh: '在数字盘上找出尽可能多的、数字总和等于目标值的长方形。',
    },
    players: { min: 1, max: 8, default: 1, soloSeats: 4, minSeats: 1 },
    rules: {
      ko: `<ul>
        <li>숫자가 적힌 7×7 판과 <b>목표 합</b>이 주어집니다.</li>
        <li>칸을 드래그해 직사각형(정사각형, 한 줄, 한 칸 포함)을 고르세요. 안의 숫자 합이 목표와 같으면 +1점, 틀리면 −1점. 이미 찾은 네모는 인정되지 않습니다.</li>
        <li>제한 시간 90초. 점수가 가장 높은 사람이 1위입니다.</li>
        <li>온라인에서는 모두 같은 판을 동시에 풀고, 한 화면에서는 한 명씩 차례로 (각자 다른 판으로) 풉니다.</li></ul>`,
      en: `<ul>
        <li>You get a 7×7 board of numbers and a <b>target sum</b>.</li>
        <li>Drag across cells to select a rectangle (squares, single rows and single cells count). If its numbers add up to the target you get +1, otherwise −1. A rectangle you already found doesn't count again.</li>
        <li>You have 90 seconds. The highest score wins.</li>
        <li>Online, everyone solves the same board at the same time. On one screen, players take turns, each with a different board.</li></ul>`,
      zh: `<ul>
        <li>给出一个写有数字的 7×7 盘面和一个<b>目标总和</b>。</li>
        <li>拖动选择一个长方形（正方形、一整行、单个格子都算）。里面的数字总和等于目标值得 +1 分，否则 −1 分。已经找到过的长方形不重复计分。</li>
        <li>限时 90 秒，分数最高的人获胜。</li>
        <li>线上模式所有人同时解同一个盘面；同屏模式每人轮流解（各自不同的盘面）。</li></ul>`,
    },
    engine, ui,
  });
})();
