  <script>/* js/games/heavy13.js */
// 1일차 감옥 매치 — 무거운 13
(() => {
  const CNAME = { R: '빨강', G: '초록', B: '파랑', W: '무지개' };
  const COL = { R: '#e5383b', G: '#4caf7a', B: '#4a90e2', W: 'linear-gradient(135deg,#e5383b,#f2c14e,#4caf7a,#4a90e2,#9b6dff)' };
  const fresh = (p) => { p.cards = [0, 1, 2, 3, 4, 5, 6]; p.chips = ['R', 'R', 'G', 'G', 'B', 'B', 'W']; };
  const sum = (st, k) => st.stands[k].reduce((a, b) => a + b, 0);
  const log = (st, m) => { st.log.unshift(m); if (st.log.length > 40) st.log.pop(); };

  function startRound(st) {
    st.round++;
    if (st.round === 8) { st.P.forEach(fresh); log(st, '<b>— 새 카드·칩 세트 지급 —</b>'); }
    st.phase = 'choose';
    st.choice = st.P.map(() => null);
    st.cur = null;
  }
  function beginPlacing(st) {
    st.choice.forEach((c, i) => {
      const p = st.P[i];
      p.cards.splice(p.cards.indexOf(c.card), 1);
      p.chips.splice(p.chips.indexOf(c.chip), 1);
    });
    const N = st.n, dist = (i) => (i - st.tiebreak + N) % N;
    const order = U.range(N).sort((a, b) => {
      const wa = st.choice[a].chip === 'W' ? 1 : 0, wb = st.choice[b].chip === 'W' ? 1 : 0;
      return wb - wa || st.choice[b].card - st.choice[a].card || dist(a) - dist(b);
    });
    log(st, `<span class="muted">라운드 ${st.round} 순서: ${order.map((i) => st.seats[i].name).join(' → ')}</span>`);
    st.queue = order; st.passed = []; st.lastPenal = null; st.phase = 'place';
    nextPlacer(st);
  }
  function nextPlacer(st) {
    if (st.queue.length) { st.cur = st.queue.shift(); st.canPass = (st.queue.length > 0 || st.passed.length > 0) && !st.choice[st.cur].passed; }
    else if (st.passed.length) { st.cur = st.passed.pop(); st.canPass = false; }
    else {
      st.cur = null;
      if (st.lastPenal !== null) st.tiebreak = st.lastPenal;
      if (st.round >= st.rounds) st.phase = 'end'; else startRound(st);
    }
  }
  function place(st, i, k) {
    const card = st.choice[i].card, t = sum(st, k);
    if (t + card >= 13) {
      const n = st.stands[k].length;
      st.P[i].pen += n; st.P[i].lastPen = ++st.clock; st.lastPenal = i;
      log(st, `<b>${st.seats[i].name}</b>: ${CNAME[k]}에 ${card} → 합 ${t + card}! <span class="bad">돌 ${n}개 떠안음 (+${n})</span>`);
      st.stands[k] = [card];
    } else {
      st.stands[k].push(card);
      log(st, `${st.seats[i].name}: ${CNAME[k]}에 ${card} (합 ${t + card})`);
    }
  }

  const engine = {
    setup(seats, opts) {
      const st = { seats, n: seats.length, rounds: opts.rounds || 7, round: 0, tiebreak: 0, clock: 0, stands: { R: [], G: [], B: [] }, log: [], P: seats.map(() => ({ pen: 0, lastPen: 0 })) };
      st.P.forEach(fresh);
      startRound(st);
      return st;
    },
    action(st, seat, a) {
      if (st.phase === 'choose' && a.t === 'choose') {
        const p = st.P[seat];
        if (st.choice[seat] || !p.cards.includes(a.card) || !p.chips.includes(a.chip)) return false;
        st.choice[seat] = { card: a.card, chip: a.chip };
        if (st.choice.every(Boolean)) beginPlacing(st);
        return;
      }
      if (st.phase === 'place' && st.cur === seat) {
        const c = st.choice[seat];
        if (a.t === 'pass') {
          if (!st.canPass) return false;
          c.passed = true; st.passed.push(seat); log(st, `${st.seats[seat].name}: 패스`);
          nextPlacer(st); return;
        }
        if (a.t === 'place') {
          const k = c.chip === 'W' ? a.stand : c.chip;
          if (!['R', 'G', 'B'].includes(k)) return false;
          place(st, seat, k); nextPlacer(st); return;
        }
      }
      return false;
    },
    active(st) {
      if (st.phase === 'choose') return U.range(st.n).filter((i) => !st.choice[i]);
      if (st.phase === 'place') return [st.cur];
      return [];
    },
    hidden: (st) => st.phase === 'choose',
    botDelay: (st) => (st.phase === 'choose' ? 500 + Math.random() * 900 : 650),
    botAct(st, i) {
      const p = st.P[i];
      if (st.phase === 'choose') {
        let best = null;
        for (const card of new Set(p.cards)) for (const chip of new Set(p.chips)) {
          const ks = chip === 'W' ? ['R', 'G', 'B'] : [chip];
          let cost = Math.min(...ks.map((k) => {
            const t = sum(st, k), n = st.stands[k].length, head = 12 - t - card;
            if (head < 0) return n + 1;
            return n * Math.max(0, 5 - head) / 6 * (0.4 + (6 - card) / 6) + (t + card) * 0.05;
          }));
          if (chip === 'W') cost += 0.8 + (p.chips.length > 3 ? 0.6 : 0);
          cost += card * 0.04 * (p.cards.length < 4 ? -1 : 1) + Math.random() * 0.6;
          if (!best || cost < best.cost) best = { cost, card, chip };
        }
        return { t: 'choose', card: best.card, chip: best.chip };
      }
      const c = st.choice[i];
      let k = c.chip;
      if (k === 'W') k = U.shuffle(['R', 'G', 'B']).sort((a, b) => (sum(st, a) + c.card >= 13 ? st.stands[a].length + 1 : 0) - (sum(st, b) + c.card >= 13 ? st.stands[b].length + 1 : 0))[0];
      if (st.canPass && sum(st, k) + c.card >= 13 && st.stands[k].length >= (c.chip === 'W' ? 1 : 2) && Math.random() < 0.85) return { t: 'pass' };
      return { t: 'place', stand: k };
    },
    view(st, me) {
      return {
        phase: st.phase, round: st.round, rounds: st.rounds, tiebreak: st.tiebreak, cur: st.cur, canPass: st.canPass,
        stands: st.stands, log: st.log.slice(0, 25),
        players: st.P.map((p, i) => ({ pen: p.pen, cards: p.cards, chosen: !!st.choice[i] })),
        choices: st.phase === 'place' ? st.choice : null,
        myChoice: me >= 0 ? st.choice[me] : null,
        myChips: me >= 0 ? st.P[me].chips : [], myCards: me >= 0 ? st.P[me].cards : [],
      };
    },
    over(st) {
      if (st.phase !== 'end') return null;
      return {
        ranking: UIx.rankBy(U.range(st.n), (i) => st.P[i].pen * 1000 + st.P[i].lastPen).map((x) => ({ ...x, score: '벌점 ' + st.P[x.seat].pen })),
        note: '원작 감옥 매치에서는 하위권이 탈락합니다.',
      };
    },
  };

  function ui(root, ctx) {
    let view = null, card = null, chip = null;
    const statusEl = h('div', { class: 'big' });
    const standEl = h('div', { class: 'row', style: { gap: '14px', alignItems: 'flex-end' } });
    const ctrl = h('div', { class: 'col' });
    const playersEl = h('table', { class: 'tbl' });
    const logEl = h('div', { class: 'log' });
    const dot = (k, s = 12) => h('span', { style: { display: 'inline-block', width: s + 'px', height: s + 'px', borderRadius: '50%', background: COL[k], verticalAlign: 'middle', marginRight: '5px' } });

    function drawCtrl() {
      ctrl.innerHTML = '';
      const v = view;
      if (v.me < 0) return;
      if (v.phase === 'choose' && !v.myChoice) {
        ctrl.append(h('h4', { class: 'muted', style: { margin: 0 } }, '돌 카드'),
          h('div', { class: 'row' }, ...[0, 1, 2, 3, 4, 5, 6].map((x) => h('button', { class: 'btn' + (card === x ? ' on' : ''), disabled: !v.myCards.includes(x), style: { width: '44px', fontWeight: 800 }, onclick: () => { card = x; drawCtrl(); } }, x))),
          h('h4', { class: 'muted', style: { margin: 0 } }, '칩'),
          h('div', { class: 'row' }, ...['R', 'G', 'B', 'W'].map((k) => {
            const n = v.myChips.filter((c) => c === k).length;
            return h('button', { class: 'btn' + (chip === k ? ' on' : ''), disabled: !n, onclick: () => { chip = k; drawCtrl(); } }, dot(k, 14), `${CNAME[k]} ×${n}`);
          })),
          h('div', {}, h('button', { class: 'btn primary', disabled: card === null || chip === null, onclick: () => { ctx.send({ t: 'choose', card, chip }); card = chip = null; } }, '동시에 내기')));
      } else if (v.phase === 'choose') ctrl.append(h('div', { class: 'muted' }, `냈습니다: ${v.myChoice.card} / ${CNAME[v.myChoice.chip]} — 다른 플레이어를 기다리는 중`));
      if (v.phase === 'place' && v.cur === v.me) {
        const c = v.choices[v.me], t = (k) => v.stands[k].reduce((a, b) => a + b, 0);
        const row = h('div', { class: 'row' });
        if (c.chip === 'W') for (const k of ['R', 'G', 'B']) row.append(h('button', { class: 'btn primary', onclick: () => ctx.send({ t: 'place', stand: k }) }, `${CNAME[k]}에 놓기 (→${t(k) + c.card})`));
        else row.append(h('button', { class: 'btn primary', onclick: () => ctx.send({ t: 'place' }) }, `${CNAME[c.chip]}에 ${c.card} 놓기 (→${t(c.chip) + c.card})`));
        if (v.canPass) row.append(h('button', { class: 'btn', onclick: () => ctx.send({ t: 'pass' }) }, '패스 (나중에 놓기)'));
        ctrl.append(h('div', { class: 'hl' }, '내 차례입니다'), row);
      }
    }

    root.append(h('div', { class: 'split' },
      h('div', { class: 'col' }, statusEl, h('div', { class: 'panel' }, standEl), h('div', { class: 'panel col' }, ctrl)),
      h('div', { class: 'col' }, h('div', { class: 'panel' }, playersEl), h('div', { class: 'panel' }, h('h4', {}, '기록'), logEl))));

    return {
      update(v) {
        if (view && (view.me !== v.me || view.round !== v.round)) card = chip = null;
        view = v;
        statusEl.textContent = v.phase === 'end' ? '게임 종료' : v.phase === 'choose' ? `라운드 ${v.round}/${v.rounds} — 카드와 칩을 고르세요` : `라운드 ${v.round}/${v.rounds} — ${v.names[v.cur]} 차례`;
        standEl.innerHTML = '';
        for (const k of ['R', 'G', 'B']) {
          const t = v.stands[k].reduce((a, b) => a + b, 0);
          standEl.append(h('div', { class: 'col', style: { alignItems: 'center', gap: '4px', width: '110px' } },
            h('div', { style: { display: 'flex', flexDirection: 'column-reverse', gap: '3px', minHeight: '170px' } },
              ...v.stands[k].map((x) => h('div', { style: { width: '70px', height: '22px', borderRadius: '10px', background: '#8d8d99', color: '#111', textAlign: 'center', fontWeight: 800, fontSize: '14px' } }, x))),
            h('div', { style: { width: '100px', height: '12px', borderRadius: '4px', background: COL[k] } }),
            h('div', { class: t >= 9 ? 'bad' : '' }, h('b', { style: { fontSize: '22px' } }, t), h('span', { class: 'muted' }, ` /13 · ${v.stands[k].length}개`))));
        }
        playersEl.innerHTML = '';
        playersEl.append(h('tr', {}, h('th', {}, '플레이어'), h('th', {}, '이번 라운드'), h('th', {}, '남은 카드'), h('th', {}, '벌점')));
        v.players.forEach((p, i) => playersEl.append(h('tr', { class: i === v.me ? 'me' : '' },
          h('td', {}, (v.cur === i ? '▶ ' : '') + (v.tiebreak === i ? '⚑ ' : '') + v.names[i]),
          h('td', {}, v.choices ? h('span', {}, dot(v.choices[i].chip), v.choices[i].card) : p.chosen ? '✓' : '…'),
          h('td', { style: { fontSize: '12px' } }, p.cards.join(' ')),
          h('td', {}, h('b', {}, p.pen)))));
        logEl.innerHTML = v.log.map((m) => `<div>${m}</div>`).join('');
        drawCtrl();
      },
    };
  }

  registerGame({
    id: 'heavy13', name: '무거운 13', en: 'Heavy 13',
    summary: '돌 카드와 색 칩을 동시에 내서 받침대에 돌을 쌓습니다. 13을 넘기면 위에 있던 돌을 전부 떠안습니다.',
    players: { min: 1, max: 8, default: 3, soloSeats: 5, minSeats: 3 },
    options: [{ key: 'rounds', label: '라운드', default: 7, choices: [[7, '빠른 7'], [14, '원작 14']] }],
    rules: `
    <ul>
      <li>각자 <b>돌 카드 0~6</b> 7장과 <b>칩 7개</b>(빨강 2, 초록 2, 파랑 2, 무지개 1)를 가집니다. 받침대는 빨강·초록·파랑 3개입니다.</li>
      <li>매 라운드 모두 카드 1장과 칩 1개를 <b>동시에</b> 냅니다. 칩 색이 받침대를, 카드 숫자가 돌의 무게를 정합니다. 무지개 칩은 자기 차례에 받침대를 고릅니다.</li>
      <li>놓는 순서: <b>무지개 칩</b> 먼저, 그다음 <b>큰 숫자부터</b>. 같으면 타이브레이크(⚑) 보유자부터 시계 방향.</li>
      <li>자기 차례에 <b>패스</b>하면 모두가 놓은 뒤에 놓습니다(먼저 패스한 사람이 가장 마지막). 줄의 마지막 사람은 패스할 수 없습니다.</li>
      <li>받침대 합이 <b>13 이상</b>이 되면 그 받침대에 있던 돌을 모두 가져갑니다. 돌 1개당 벌점 1점(0도 1점)이며, 방금 놓은 돌은 남습니다.</li>
      <li>그 라운드 마지막으로 벌점을 받은 사람이 다음 타이브레이크를 가집니다.</li>
      <li>7라운드(빠른) 또는 14라운드(원작, 7라운드 뒤 새 세트). <b>벌점이 가장 적은 사람</b>이 이기고, 동점이면 나중에 벌점을 받은 사람이 아래입니다.</li>
    </ul>
    <div class="note">3명 미만이면 봇이 채웁니다.</div>`,
    engine, ui,
  });
})();

</script>

  <script>/* js/games/spotdiff.js */
// 2일차 유배지 매치 — 달라진 그림 찾기
(() => {
  const N = 6, CH = 5, ROUNDS = 3, MEMO = [20, 15, 12], FIND_MS = 45000, RESULT_MS = 6000;
  const SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'cross'];
  const COLORS = ['#e5383b', '#f2c14e', '#4caf7a', '#4a90e2', '#9b6dff', '#eeeeee'];

  function gen() {
    const orig = U.range(N * N).map(() => (Math.random() < 0.25 ? null : { s: U.pick(SHAPES), c: U.pick(COLORS) }));
    const mod = orig.map((x) => (x ? { ...x } : null));
    const changed = U.shuffle(U.range(N * N)).slice(0, CH);
    for (const i of changed) {
      const x = mod[i];
      if (!x) mod[i] = { s: U.pick(SHAPES), c: U.pick(COLORS) };
      else {
        const r = U.rnd(3);
        if (r === 0) { let s; do s = U.pick(SHAPES); while (s === x.s); x.s = s; }
        else if (r === 1) { let c; do c = U.pick(COLORS); while (c === x.c); x.c = c; }
        else mod[i] = null;
      }
    }
    return { orig, mod, changed };
  }
  function newRound(st, now) {
    st.round++;
    Object.assign(st, gen());
    st.phase = 'memo'; st.deadline = now + MEMO[Math.min(st.round - 1, 2)] * 1000;
    st.ready = st.seats.map((s) => s.bot);
    st.marks = st.seats.map(() => null);
    st.hits = null;
  }
  function toFind(st, now) { st.phase = 'find'; st.deadline = now + FIND_MS; }
  function toResult(st, now) {
    st.hits = st.seats.map((s, i) => {
      if (s.bot) { let n = 0; for (let k = 0; k < CH; k++) if (Math.random() < 0.62) n++; return n; }
      return (st.marks[i] || []).filter((x) => st.changed.includes(x)).length;
    });
    st.hits.forEach((x, i) => (st.score[i] += x));
    st.phase = 'result'; st.deadline = now + RESULT_MS;
  }

  const engine = {
    setup(seats, opts) {
      const st = { seats, n: seats.length, local: opts.local, round: 0, score: seats.map(() => 0) };
      newRound(st, opts.now);
      return st;
    },
    action(st, seat, a, now) {
      if (a.t === 'ready' && st.phase === 'memo') {
        st.ready[seat] = true;
        if (st.local || st.ready.every(Boolean)) toFind(st, now);
        return;
      }
      if (a.t === 'submit' && st.phase === 'find' && !st.marks[seat]) {
        const m = [...new Set((a.marks || []).map((x) => x | 0))].filter((x) => x >= 0 && x < N * N);
        if (m.length !== CH) return false;
        st.marks[seat] = m;
        if (st.seats.every((s, i) => s.bot || st.marks[i])) toResult(st, now);
        return;
      }
      return false;
    },
    tick(st, now) {
      if (now < st.deadline) return false;
      if (st.phase === 'memo') toFind(st, now);
      else if (st.phase === 'find') toResult(st, now);
      else if (st.phase === 'result') { if (st.round >= ROUNDS) st.phase = 'end'; else newRound(st, now); }
      else return false;
      return true;
    },
    active(st) {
      if (st.phase === 'memo') return U.range(st.n).filter((i) => !st.ready[i]);
      if (st.phase === 'find') return U.range(st.n).filter((i) => !st.seats[i].bot && !st.marks[i]);
      return [];
    },
    hidden: (st) => st.phase === 'find',
    view(st, me) {
      const v = { phase: st.phase, round: st.round, deadline: st.deadline, score: st.score, submitted: st.marks.map(Boolean) };
      if (st.phase === 'memo') v.pic = st.orig;
      if (st.phase === 'find') { v.pic = st.mod; v.myMarks = me >= 0 ? st.marks[me] : null; }
      if (st.phase === 'result' || st.phase === 'end') { v.pic = st.mod; v.changed = st.changed; v.myMarks = me >= 0 ? st.marks[me] : null; v.hits = st.hits; }
      return v;
    },
    over(st) {
      if (st.phase !== 'end') return null;
      return { ranking: UIx.rankBy(U.range(st.n), (i) => -st.score[i]).map((x) => ({ ...x, score: st.score[x.seat] + '점' })), note: '원작에서는 최하위가 탈락합니다.' };
    },
  };

  function shapeSvg(s, c) {
    const P = { circle: `<circle cx="20" cy="20" r="13" fill="${c}"/>`, square: `<rect x="8" y="8" width="24" height="24" rx="3" fill="${c}"/>`,
      triangle: `<polygon points="20,6 34,32 6,32" fill="${c}"/>`, diamond: `<polygon points="20,5 35,20 20,35 5,20" fill="${c}"/>`,
      star: `<polygon points="20,4 24,15 36,15 26,22 30,34 20,27 10,34 14,22 4,15 16,15" fill="${c}"/>`,
      cross: `<polygon points="15,6 25,6 25,15 34,15 34,25 25,25 25,34 15,34 15,25 6,25 6,15 15,15" fill="${c}"/>` };
    return `<svg viewBox="0 0 40 40" width="100%" height="100%">${P[s] || ''}</svg>`;
  }

  function ui(root, ctx) {
    let view = null, marks = new Set(), key = null;
    const status = h('div', { class: 'big' });
    const area = h('div');
    const ctrl = h('div', { class: 'row' });
    const scoreBox = h('div');

    function drawGrid() {
      const v = view;
      area.innerHTML = '';
      if (!v.pic) return;
      const canMark = v.phase === 'find' && !v.myMarks && v.me >= 0;
      const g = h('div', { class: 'board', style: { gridTemplateColumns: `repeat(${N}, 58px)` } });
      const shown = v.myMarks ? new Set(v.myMarks) : marks;
      v.pic.forEach((x, i) => {
        const el = h('div', { class: 'cell', style: { height: '58px', position: 'relative', cursor: canMark ? 'pointer' : 'default' }, html: x ? shapeSvg(x.s, x.c) : '' });
        if (v.phase !== 'memo' && shown.has(i)) el.append(h('div', { style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#ff3b3b', fontSize: '44px', fontWeight: 900, textShadow: '0 0 4px #000' } }, '✕'));
        if (v.changed && v.changed.includes(i)) el.style.outline = '3px solid #4caf7a';
        else if (v.changed && shown.has(i)) el.style.outline = '3px solid #e5383b';
        if (canMark) el.addEventListener('click', () => { if (marks.has(i)) marks.delete(i); else if (marks.size < CH) marks.add(i); drawGrid(); drawCtrl(); });
        g.append(el);
      });
      area.append(g);
    }
    function drawCtrl() {
      ctrl.innerHTML = '';
      const v = view;
      if (v.me < 0) return;
      if (v.phase === 'memo') ctrl.append(h('button', { class: 'btn', onclick: () => ctx.send({ t: 'ready' }) }, '다 외웠어요'));
      if (v.phase === 'find' && !v.myMarks) ctrl.append(h('button', { class: 'btn primary', disabled: marks.size !== CH, onclick: () => ctx.send({ t: 'submit', marks: [...marks] }) }, `제출 (${marks.size}/5)`));
    }
    function tickTimer() {
      if (!view) return;
      const s = UIx.secs(view.deadline, ctx.now()), v = view;
      if (v.phase === 'memo') status.textContent = `라운드 ${v.round}/${ROUNDS} — 외우세요 ${s}`;
      else if (v.phase === 'find') status.textContent = v.myMarks ? `제출 완료 — 다른 사람을 기다리는 중 ${s}` : `달라진 곳 5개를 고르세요 ${s}`;
    }
    const iv = setInterval(tickTimer, 250);

    root.append(h('div', { class: 'split' },
      h('div', { class: 'col', style: { alignItems: 'center' } }, status, area, ctrl),
      h('div', { class: 'col' }, h('div', { class: 'panel col' }, h('h4', {}, '점수'), scoreBox))));
    return {
      update(v) {
        const k = `${v.round}-${v.phase}-${v.me}`;
        if (k !== key) { marks = new Set(); key = k; }
        view = v;
        drawGrid(); drawCtrl(); tickTimer();
        if (v.phase === 'result' || v.phase === 'end') {
          const mine = v.me >= 0 ? `내 정답 ${v.hits[v.me]}/5 · ` : '';
          status.innerHTML = `${mine}<span class="muted" style="font-size:14px">초록 테두리 = 정답 칸</span>`;
        }
        scoreBox.innerHTML = '';
        scoreBox.append(UIx.scoreboard(v.names.map((n, i) => ({ name: n, value: v.score[i], me: i === v.me, sub: v.hits ? `(+${v.hits[i]})` : v.phase === 'find' && v.submitted[i] ? '✓' : '' }))));
      },
      destroy() { clearInterval(iv); },
    };
  }

  registerGame({
    id: 'spotdiff', name: '달라진 그림 찾기', en: 'Spot the Difference',
    summary: '그림을 외운 뒤, 바뀐 그림에서 달라진 곳 5군데를 X로 표시하세요.',
    players: { min: 1, max: 8, default: 1, soloSeats: 3, minSeats: 1 },
    rules: `
    <ul>
      <li>그림이 정해진 시간 동안 공개됩니다(20초 → 15초 → 12초). 잘 외워 두세요.</li>
      <li>그림이 사라지고 <b>5군데가 바뀐</b> 그림이 나옵니다(모양·색 변경, 사라짐, 새로 생김).</li>
      <li>달라졌다고 생각하는 칸을 정확히 <b>5개</b> 골라 제출하세요(45초). 맞힌 개수가 점수입니다.</li>
      <li>3라운드 합산 점수로 순위를 정합니다.</li>
      <li>한 화면에서 할 때는 외우기는 다 같이, 고르기는 한 명씩 화면을 가리고 합니다.</li>
    </ul>`,
    engine, ui,
  });
})();

</script>

  <script>/* js/games/loopfence.js */
// 3일차 유배지 매치 — 울타리 치기
(() => {
  const SIZES = { 5: [0.75, 300], 7: [0.65, 600], 10: [0.6, 900] };
  const COUNTDOWN = 3000;

  function makePuzzle(N) {
    const region = U.range(N).map(() => Array(N).fill(false));
    const inR = (r, c) => r >= 0 && c >= 0 && r < N && c < N && region[r][c];
    const noHoles = () => {
      const P = N + 2, seen = new Set([0]), st = [0];
      let cnt = 0;
      while (st.length) {
        const x = st.pop(); const r = Math.floor(x / P) - 1, c = (x % P) - 1;
        if (r >= 0 && c >= 0 && r < N && c < N) cnt++;
        for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const rr = r + a, cc = c + b;
          if (rr < -1 || cc < -1 || rr > N || cc > N || inR(rr, cc)) continue;
          const k = (rr + 1) * P + cc + 1;
          if (!seen.has(k)) { seen.add(k); st.push(k); }
        }
      }
      return cnt === N * N - region.flat().filter(Boolean).length;
    };
    const checker = (r, c) => {
      for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
        const a = inR(r + dr, c + dc), b = inR(r + dr, c + dc + 1), d = inR(r + dr + 1, c + dc), e = inR(r + dr + 1, c + dc + 1);
        if ((a && e && !b && !d) || (b && d && !a && !e)) return true;
      }
      return false;
    };
    region[U.rnd(N)][U.rnd(N)] = true;
    let size = 1, fails = 0;
    while (size < Math.floor(N * N * 0.5) && fails < 4000) {
      const cand = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!region[r][c] && (inR(r - 1, c) || inR(r + 1, c) || inR(r, c - 1) || inR(r, c + 1))) cand.push([r, c]);
      const [r, c] = U.pick(cand);
      region[r][c] = true;
      if (checker(r, c) || !noHoles()) { region[r][c] = false; fails++; continue; }
      size++;
    }
    const ratio = SIZES[N][0];
    const clue = U.range(N).map((r) => U.range(N).map((c) => {
      const n4 = [[-1, 0], [1, 0], [0, -1], [0, 1]].filter(([a, b]) => inR(r + a, c + b) !== region[r][c]).length;
      return Math.random() < ratio ? n4 : null;
    }));
    const solution = [];
    for (let r = 0; r <= N; r++) for (let c = 0; c < N; c++) if (inR(r - 1, c) !== inR(r, c)) solution.push(`h${r},${c}`);
    for (let r = 0; r < N; r++) for (let c = 0; c <= N; c++) if (inR(r, c - 1) !== inR(r, c)) solution.push(`v${r},${c}`);
    return { N, clue, solution };
  }
  function check(P, lines) {
    const L = new Set(lines), N = P.N;
    const E = (t, r, c) => L.has(`${t}${r},${c}`);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (P.clue[r][c] !== null) {
      if (E('h', r, c) + E('h', r + 1, c) + E('v', r, c) + E('v', r, c + 1) !== P.clue[r][c]) return false;
    }
    const adj = {};
    const add = (a, b) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); };
    for (const k of L) {
      const m = /^([hv])(\d+),(\d+)$/.exec(k); if (!m) return false;
      const r = +m[2], c = +m[3];
      if (m[1] === 'h') add(`${r},${c}`, `${r},${c + 1}`); else add(`${r},${c}`, `${r + 1},${c}`);
    }
    const vs = Object.keys(adj);
    if (!vs.length || vs.some((v) => adj[v].length !== 2)) return false;
    const seen = new Set([vs[0]]), st = [vs[0]];
    while (st.length) for (const w of adj[st.pop()]) if (!seen.has(w)) { seen.add(w); st.push(w); }
    return seen.size === vs.length;
  }

  const engine = {
    setup(seats, opts) {
      const N = opts.size || 7, limit = SIZES[N][1] * 1000;
      const shared = makePuzzle(N);
      const st = { seats, n: seats.length, N, limit, P: [], phase: [], start: [], deadline: [], time: [], botAt: [] };
      seats.forEach((s, i) => {
        st.P[i] = opts.local && !s.bot ? makePuzzle(N) : shared;
        st.time[i] = null;
        if (opts.local && !s.bot) st.phase[i] = 'ready';
        else { st.phase[i] = 'play'; st.start[i] = opts.now + COUNTDOWN; st.deadline[i] = st.start[i] + limit; }
        if (s.bot) st.botAt[i] = Math.random() < 0.8 ? limit * (0.25 + Math.random() * 0.7) : Infinity;
      });
      return st;
    },
    action(st, seat, a, now) {
      if (a.t === 'begin' && st.phase[seat] === 'ready') { st.phase[seat] = 'play'; st.start[seat] = now + COUNTDOWN; st.deadline[seat] = st.start[seat] + st.limit; return; }
      if (a.t === 'lines' && st.phase[seat] === 'play' && now >= st.start[seat] && Array.isArray(a.lines)) {
        if (check(st.P[seat], a.lines.slice(0, 1000).map(String))) { st.phase[seat] = 'done'; st.time[seat] = now - st.start[seat]; return; }
        return false;
      }
      return false;
    },
    tick(st, now) {
      let ch = false;
      st.seats.forEach((s, i) => {
        if (st.phase[i] !== 'play') return;
        if (s.bot && now - st.start[i] >= st.botAt[i]) { st.phase[i] = 'done'; st.time[i] = st.botAt[i]; ch = true; }
        else if (now > st.deadline[i]) { st.phase[i] = 'out'; ch = true; }
      });
      return ch;
    },
    active: (st) => U.range(st.n).filter((i) => !st.seats[i].bot && (st.phase[i] === 'ready' || st.phase[i] === 'play')),
    hidden: () => true,
    view(st, me) {
      const v = { phase: me >= 0 ? st.phase[me] : 'watch', status: st.phase.slice(), times: st.time.slice() };
      if (me >= 0) {
        const P = st.P[me];
        Object.assign(v, { N: P.N, clue: P.clue, pid: st.P.indexOf(P) + '-' + P.clue.flat().join(''), start: st.start[me], deadline: st.deadline[me] });
        if (st.phase[me] === 'done' || st.phase[me] === 'out') v.solution = P.solution;
      }
      return v;
    },
    over(st) {
      if (st.phase.some((p) => p === 'ready' || p === 'play')) return null;
      return { ranking: UIx.rankBy(U.range(st.n), (i) => (st.time[i] == null ? 1e12 : st.time[i])).map((x) => ({ ...x, score: st.time[x.seat] == null ? '실패' : (st.time[x.seat] / 1000).toFixed(1) + '초' })) };
    },
  };

  function ui(root, ctx) {
    let view = null, edges = {}, pid = null;
    const svgWrap = h('div');
    const head = h('div', { class: 'big' });
    const timerEl = h('span', { class: 'timer' });
    const box = h('div', { class: 'col', style: { alignItems: 'center' } });
    const scoreBox = h('div');
    const ek = (t, r, c) => `${t}${r},${c}`;
    const E = (t, r, c) => edges[ek(t, r, c)] || 0;

    function draw() {
      const v = view;
      if (!v.clue) { svgWrap.innerHTML = ''; return; }
      const N = v.N, S = Math.min(48, Math.floor(460 / N)), M = 16, W = N * S + M * 2;
      const fin = v.solution;
      const lineSet = fin ? Object.fromEntries(v.solution.map((k) => [k, 1])) : null;
      const val = (t, r, c) => (fin ? lineSet[ek(t, r, c)] || 0 : E(t, r, c));
      let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:${W + 40}px;touch-action:manipulation">`;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (v.clue[r][c] !== null) {
        const cnt = (val('h', r, c) === 1) + (val('h', r + 1, c) === 1) + (val('v', r, c) === 1) + (val('v', r, c + 1) === 1);
        const col = cnt === v.clue[r][c] ? '#4caf7a' : cnt > v.clue[r][c] ? '#e5383b' : '#ececf1';
        s += `<text x="${M + c * S + S / 2}" y="${M + r * S + S / 2 + S * 0.17}" text-anchor="middle" font-size="${S * 0.5}" font-weight="700" fill="${col}">${v.clue[r][c]}</text>`;
      }
      const edge = (t, r, c, x1, y1, x2, y2) => {
        const e = val(t, r, c);
        if (e === 1) s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${fin ? '#4caf7a' : '#f2c14e'}" stroke-width="${S * 0.12}" stroke-linecap="round"/>`;
        if (e === 2) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, d = S * 0.1; s += `<path d="M${mx - d} ${my - d}L${mx + d} ${my + d}M${mx + d} ${my - d}L${mx - d} ${my + d}" stroke="#e5383b" stroke-width="2"/>`; }
        if (!fin) s += `<line data-e="${ek(t, r, c)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="${S * 0.45}" style="cursor:pointer"/>`;
      };
      for (let r = 0; r <= N; r++) for (let c = 0; c < N; c++) edge('h', r, c, M + c * S, M + r * S, M + (c + 1) * S, M + r * S);
      for (let r = 0; r < N; r++) for (let c = 0; c <= N; c++) edge('v', r, c, M + c * S, M + r * S, M + c * S, M + (r + 1) * S);
      for (let r = 0; r <= N; r++) for (let c = 0; c <= N; c++) s += `<circle cx="${M + c * S}" cy="${M + r * S}" r="${Math.max(2.5, S * 0.07)}" fill="#9a9aa8" pointer-events="none"/>`;
      svgWrap.innerHTML = s + '</svg>';
    }
    function clickEdge(k, right) {
      const v = view;
      if (!v || v.phase !== 'play' || ctx.now() < v.start) return;
      const x = edges[k] || 0;
      edges[k] = right ? (x === 2 ? 0 : 2) : (x + 1) % 3;
      draw();
      ctx.send({ t: 'lines', lines: Object.keys(edges).filter((q) => edges[q] === 1) });
    }
    svgWrap.addEventListener('click', (e) => { const k = e.target.dataset && e.target.dataset.e; if (k) clickEdge(k, false); });
    svgWrap.addEventListener('contextmenu', (e) => { e.preventDefault(); const k = e.target.dataset && e.target.dataset.e; if (k) clickEdge(k, true); });

    function tickTimer() {
      const v = view; if (!v || v.phase !== 'play') { timerEl.textContent = ''; return; }
      const now = ctx.now();
      if (now < v.start) { head.innerHTML = `시작까지 <span class="hl">${UIx.secs(v.start, now)}</span>`; return; }
      head.textContent = '닫힌 고리 하나를 만드세요';
      const s = UIx.secs(v.deadline, now);
      timerEl.textContent = UIx.mmss(s); timerEl.classList.toggle('warn', s <= 30);
    }
    const iv = setInterval(tickTimer, 250);

    root.append(h('div', { class: 'split' },
      h('div', { class: 'col', style: { alignItems: 'center' } }, head, box, svgWrap),
      h('div', { class: 'col' },
        h('div', { class: 'panel row' }, h('span', {}, '남은 시간'), h('span', { style: { flex: 1 } }), timerEl),
        h('div', { class: 'panel col' }, h('h4', {}, '진행 상황'), scoreBox),
        h('div', { class: 'panel col' }, h('div', { class: 'muted', style: { fontSize: '13px' } }, '변 클릭: 선 → ✕ → 빈칸 / 우클릭: ✕'),
          h('div', {}, h('button', { class: 'btn', onclick: () => { edges = {}; draw(); ctx.send({ t: 'lines', lines: [] }); } }, '전부 지우기'))))));

    return {
      update(v) {
        if (v.pid !== pid) { pid = v.pid; edges = {}; }
        view = v;
        box.innerHTML = '';
        if (v.phase === 'ready') box.append(h('div', { class: 'big' }, `${v.names[v.me]} 님 준비`), h('button', { class: 'btn primary', onclick: () => ctx.send({ t: 'begin' }) }, '시작'));
        if (v.phase === 'watch') box.append(h('div', { class: 'muted' }, '다른 플레이어를 기다리는 중...'));
        if (v.phase === 'done') head.innerHTML = '<span class="good">완성!</span> 다른 플레이어를 기다리는 중';
        if (v.phase === 'out') head.innerHTML = '<span class="bad">시간 초과</span> — 정답 고리를 보여 드려요';
        if (v.phase === 'ready' || v.phase === 'watch') { svgWrap.innerHTML = ''; head.textContent = ''; } else draw();
        tickTimer();
        scoreBox.innerHTML = '';
        scoreBox.append(UIx.scoreboard(v.names.map((n, i) => ({ name: n, me: i === v.me, value: v.status[i] === 'done' ? (v.times[i] / 1000).toFixed(0) + 's' : v.status[i] === 'out' ? '✕' : '…' }))));
      },
      destroy() { clearInterval(iv); },
    };
  }

  registerGame({
    id: 'loopfence', name: '울타리 치기', en: 'Loop Fence Puzzle',
    summary: '숫자를 만족하도록 점과 점을 이어 하나의 닫힌 울타리를 만드세요. 여럿이면 누가 먼저 푸나 대결!',
    players: { min: 1, max: 8, default: 1, soloSeats: 1, minSeats: 1 },
    options: [{ key: 'size', label: '크기', default: 7, choices: [[5, '5×5'], [7, '7×7'], [10, '10×10 (원작)']] }],
    rules: `
    <ul>
      <li>점 사이의 선을 이어 <b>하나의 닫힌 고리</b>를 만듭니다. 고리는 갈라지거나 교차할 수 없습니다.</li>
      <li>칸 안의 숫자는 그 칸의 네 변 중 <b>울타리가 지나가는 변의 개수</b>입니다.</li>
      <li>변을 클릭하면 <b>선 → ✕ → 빈칸</b> 순으로 바뀝니다. 우클릭은 바로 ✕.</li>
      <li>숫자를 모두 만족하는 고리가 완성되면 자동으로 완료됩니다. 여럿이 하면 <b>빨리 푼 순서</b>로 순위가 정해집니다.</li>
      <li>제한 시간: 5×5 5분, 7×7 10분, 10×10 15분.</li>
    </ul>`,
    engine, ui,
  });
})();

</script>

  <script>/* js/games/wallgo.js */
// 4일차 감옥 매치 — 벽바둑 2
(() => {
  const N = 7;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const COL = ['#f2c14e', '#4a90e2', '#4caf7a', '#ff5d8f'];
  const PIECES = { 2: 4, 3: 3, 4: 2 };

  // ---- 판 계산 (state: {wh, wv, pieces}) ----
  const pieceAt = (st, r, c) => st.pieces.find((p) => p.r === r && p.c === c);
  function blocked(st, r, c, dr, dc) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N) return true;
    if (dr === 1) return st.wh[r][c];
    if (dr === -1) return st.wh[rr][c];
    if (dc === 1) return st.wv[r][c];
    return st.wv[r][cc];
  }
  function reachable(st, p) {
    const out = new Map([[`${p.r},${p.c}`, [p.r, p.c]]]);
    let fr = [[p.r, p.c]];
    for (let step = 0; step < 2; step++) {
      const nf = [];
      for (const [r, c] of fr) for (const [dr, dc] of DIRS) {
        if (blocked(st, r, c, dr, dc)) continue;
        const rr = r + dr, cc = c + dc, k = `${rr},${cc}`;
        if (out.has(k) || pieceAt(st, rr, cc)) continue;
        out.set(k, [rr, cc]); nf.push([rr, cc]);
      }
      fr = nf;
    }
    return [...out.values()];
  }
  function wallOptions(st, r, c) {
    const o = [];
    if (r < N - 1 && !st.wh[r][c]) o.push(['h', r, c]);
    if (r > 0 && !st.wh[r - 1][c]) o.push(['h', r - 1, c]);
    if (c < N - 1 && !st.wv[r][c]) o.push(['v', r, c]);
    if (c > 0 && !st.wv[r][c - 1]) o.push(['v', r, c - 1]);
    return o;
  }
  const setWall = (st, [t, r, c], v) => { (t === 'h' ? st.wh : st.wv)[r][c] = v; };
  function regions(st) {
    const id = U.range(N).map(() => Array(N).fill(-1)), regs = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (id[r][c] < 0) {
      const reg = { cells: [], owners: new Set() }, stack = [[r, c]];
      id[r][c] = regs.length;
      while (stack.length) {
        const [a, b] = stack.pop(); reg.cells.push([a, b]);
        const p = pieceAt(st, a, b); if (p) reg.owners.add(p.o);
        for (const [dr, dc] of DIRS) if (!blocked(st, a, b, dr, dc) && id[a + dr][b + dc] < 0) { id[a + dr][b + dc] = regs.length; stack.push([a + dr, b + dc]); }
      }
      regs.push(reg);
    }
    return regs;
  }
  function scores(st) {
    const sc = U.range(st.n).map(() => 0);
    for (const g of regions(st)) if (g.owners.size === 1) sc[[...g.owners][0]] += g.cells.length;
    return sc;
  }
  const canMove = (st, o) => st.pieces.some((p) => p.o === o && (reachable(st, p).length > 1 || wallOptions(st, p.r, p.c).length));
  // 봇 평가: 벽을 고려한 가장 가까운 말 기준 영역
  function evalFor(st, me) {
    const d = U.range(st.n).map(() => U.range(N).map(() => Array(N).fill(99)));
    for (let o = 0; o < st.n; o++) {
      const q = st.pieces.filter((p) => p.o === o).map((p) => [p.r, p.c]);
      q.forEach(([r, c]) => (d[o][r][c] = 0));
      for (let i = 0; i < q.length; i++) {
        const [r, c] = q[i];
        for (const [dr, dc] of DIRS) if (!blocked(st, r, c, dr, dc) && d[o][r + dr][c + dc] > d[o][r][c] + 1) { d[o][r + dr][c + dc] = d[o][r][c] + 1; q.push([r + dr, c + dc]); }
      }
    }
    const cnt = U.range(st.n).map(() => 0);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let best = 99, who = -1;
      for (let o = 0; o < st.n; o++) { if (d[o][r][c] < best) { best = d[o][r][c]; who = o; } else if (d[o][r][c] === best) who = -1; }
      if (who >= 0) cnt[who]++;
    }
    const sc = scores(st);
    const mine = cnt[me] + sc[me] * 0.6;
    const others = Math.max(...U.range(st.n).filter((o) => o !== me).map((o) => cnt[o] + sc[o] * 0.6));
    return mine - others;
  }
  function isOver(st) { return regions(st).every((g) => g.owners.size <= 1) || U.range(st.n).every((o) => !canMove(st, o)); }
  function advanceTurn(st) {
    if (isOver(st)) { st.phase = 'end'; return; }
    for (let k = 1; k <= st.n; k++) {
      const o = (st.turn + k) % st.n;
      if (canMove(st, o)) { st.turn = o; return; }
    }
    st.phase = 'end';
  }

  const engine = {
    setup(seats) {
      const n = seats.length, per = PIECES[n] || 2;
      const st = { seats, n, wh: U.range(N - 1).map(() => Array(N).fill(false)), wv: U.range(N).map(() => Array(N - 1).fill(false)), pieces: [], phase: 'place', turn: 0, last: null };
      st.order = [];
      for (let k = 0; k < per; k++) for (let i = 0; i < n; i++) st.order.push(k % 2 ? n - 1 - i : i); // 뱀 순서
      return st;
    },
    action(st, seat, a) {
      if (st.phase === 'place' && a.t === 'place' && st.order[0] === seat) {
        if (a.r < 0 || a.c < 0 || a.r >= N || a.c >= N || pieceAt(st, a.r, a.c)) return false;
        st.pieces.push({ o: seat, r: a.r, c: a.c }); st.order.shift();
        if (!st.order.length) { st.phase = 'move'; st.turn = st.n - 1; advanceTurn(st); }
        return;
      }
      if (st.phase === 'move' && a.t === 'move' && st.turn === seat) {
        const p = pieceAt(st, a.from[0], a.from[1]);
        if (!p || p.o !== seat) return false;
        if (!reachable(st, p).some(([r, c]) => r === a.to[0] && c === a.to[1])) return false;
        p.r = a.to[0]; p.c = a.to[1];
        const opts = wallOptions(st, p.r, p.c);
        if (opts.length) {
          const w = opts.find((o) => a.wall && o[0] === a.wall[0] && o[1] === a.wall[1] && o[2] === a.wall[2]);
          if (!w) { p.r = a.from[0]; p.c = a.from[1]; return false; }
          setWall(st, w, true);
        }
        st.last = { from: a.from, to: a.to, wall: a.wall };
        advanceTurn(st);
        return;
      }
      return false;
    },
    active: (st) => (st.phase === 'place' ? [st.order[0]] : st.phase === 'move' ? [st.turn] : []),
    hidden: () => false,
    botDelay: () => 550,
    botAct(st, me) {
      if (st.phase === 'place') {
        let best = null;
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!pieceAt(st, r, c)) {
          st.pieces.push({ o: me, r, c });
          const v = evalFor(st, me) + Math.random() * 0.5;
          st.pieces.pop();
          if (!best || v > best.v) best = { v, r, c };
        }
        return { t: 'place', r: best.r, c: best.c };
      }
      let best = null;
      for (const p of st.pieces.filter((q) => q.o === me)) {
        const or = p.r, oc = p.c;
        for (const [r, c] of reachable(st, p)) {
          p.r = r; p.c = c;
          const opts = wallOptions(st, r, c);
          if (!opts.length) { const v = evalFor(st, me); if (!best || v > best.v) best = { v, from: [or, oc], to: [r, c], wall: null }; }
          for (const w of opts) {
            setWall(st, w, true);
            const v = evalFor(st, me) + Math.random() * 0.3;
            setWall(st, w, false);
            if (!best || v > best.v) best = { v, from: [or, oc], to: [r, c], wall: w };
          }
        }
        p.r = or; p.c = oc;
      }
      return best ? { t: 'move', from: best.from, to: best.to, wall: best.wall } : null;
    },
    view(st) {
      return { phase: st.phase, turn: st.turn, placer: st.order[0], wh: st.wh, wv: st.wv, pieces: st.pieces, last: st.last, scores: scores(st), regions: st.phase === 'end' ? regions(st).map((g) => ({ cells: g.cells, owner: g.owners.size === 1 ? [...g.owners][0] : -1 })) : null };
    },
    over(st) {
      if (st.phase !== 'end') return null;
      const sc = scores(st);
      return { ranking: UIx.rankBy(U.range(st.n), (i) => -sc[i]).map((x) => ({ ...x, score: sc[x.seat] + '칸' })) };
    },
  };

  function ui(root, ctx) {
    const S = 58, M = 12;
    let view = null, selPiece = null, reach = null, dest = null;
    const status = h('div', { class: 'big' });
    const svgWrap = h('div');
    const scoreBox = h('div');
    const info = h('div', { class: 'muted', style: { fontSize: '13px' } });
    // view 데이터를 엔진 계산 함수에 그대로 넘길 수 있게 맞춤
    const board = () => ({ wh: view.wh, wv: view.wv, pieces: view.pieces });

    function myTurn() { return view.me >= 0 && ((view.phase === 'place' && view.placer === view.me) || (view.phase === 'move' && view.turn === view.me)); }
    function draw() {
      const v = view, W = N * S + M * 2;
      let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:${W}px">`;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        let fill = '#1f1f26';
        if (v.regions) { const g = v.regions.find((g) => g.cells.some(([a, b]) => a === r && b === c)); if (g && g.owner >= 0) fill = COL[g.owner] + '33'; }
        if (reach && reach.some(([a, b]) => a === r && b === c)) fill = '#3a3320';
        if (dest && dest[0] === r && dest[1] === c) fill = '#5a4a20';
        s += `<rect data-cell="${r},${c}" x="${M + c * S + 2}" y="${M + r * S + 2}" width="${S - 4}" height="${S - 4}" rx="6" fill="${fill}" style="cursor:pointer"/>`;
      }
      const wl = (x1, y1, x2, y2, col, w, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
      const hw = (r, c, col, w, extra) => wl(M + c * S + 4, M + (r + 1) * S, M + (c + 1) * S - 4, M + (r + 1) * S, col, w, extra);
      const vw = (r, c, col, w, extra) => wl(M + (c + 1) * S, M + r * S + 4, M + (c + 1) * S, M + (r + 1) * S - 4, col, w, extra);
      const L = v.last && v.last.wall;
      for (let r = 0; r < N - 1; r++) for (let c = 0; c < N; c++) if (v.wh[r][c]) s += hw(r, c, L && L[0] === 'h' && L[1] === r && L[2] === c ? '#ff8a8a' : '#e5383b', 6);
      for (let r = 0; r < N; r++) for (let c = 0; c < N - 1; c++) if (v.wv[r][c]) s += vw(r, c, L && L[0] === 'v' && L[1] === r && L[2] === c ? '#ff8a8a' : '#e5383b', 6);
      for (const p of v.pieces) {
        const sel = selPiece && selPiece.r === p.r && selPiece.c === p.c;
        s += `<circle data-cell="${p.r},${p.c}" cx="${M + p.c * S + S / 2}" cy="${M + p.r * S + S / 2}" r="${S * 0.3}" fill="${COL[p.o]}" stroke="${sel ? '#fff' : '#0d0d10'}" stroke-width="${sel ? 4 : 2}" style="cursor:pointer"/>`;
      }
      if (dest) for (const [t, r, c] of wallOptions(board(), dest[0], dest[1])) {
        const data = `data-wall="${t},${r},${c}" style="cursor:pointer"`;
        s += t === 'h' ? hw(r, c, '#f2c14e', 7, 'stroke-dasharray="6 5"') + hw(r, c, 'transparent', 18, data) : vw(r, c, '#f2c14e', 7, 'stroke-dasharray="6 5"') + vw(r, c, 'transparent', 18, data);
      }
      svgWrap.innerHTML = s + '</svg>';
    }
    svgWrap.addEventListener('click', (e) => {
      if (!view || !myTurn()) return;
      const t = e.target;
      if (t.dataset.wall && dest) {
        const [k, r, c] = t.dataset.wall.split(',');
        ctx.send({ t: 'move', from: [selPiece.r, selPiece.c], to: dest, wall: [k, +r, +c] });
        selPiece = reach = dest = null; return;
      }
      if (!t.dataset.cell) return;
      const [r, c] = t.dataset.cell.split(',').map(Number);
      if (view.phase === 'place') { if (!view.pieces.some((p) => p.r === r && p.c === c)) ctx.send({ t: 'place', r, c }); return; }
      if (dest) { dest = null; reach = reachable(board(), selPiece); draw(); }
      const p = view.pieces.find((q) => q.r === r && q.c === c);
      if (p && p.o === view.me && !(selPiece && selPiece.r === r && selPiece.c === c)) { selPiece = { r, c }; reach = reachable(board(), selPiece); dest = null; draw(); return; }
      if (selPiece && reach && reach.some(([a, b]) => a === r && b === c)) {
        const opts = wallOptions(board(), r, c);
        if (!opts.length) { ctx.send({ t: 'move', from: [selPiece.r, selPiece.c], to: [r, c], wall: null }); selPiece = reach = dest = null; return; }
        dest = [r, c]; reach = null; draw();
      }
    });

    root.append(h('div', { class: 'split' },
      h('div', { class: 'col', style: { alignItems: 'center' } }, status, svgWrap),
      h('div', { class: 'col' }, h('div', { class: 'panel col' }, h('h4', {}, '확정 영역'), scoreBox, info))));

    return {
      update(v) {
        const turnChanged = !view || view.turn !== v.turn || view.phase !== v.phase || view.me !== v.me || view.pieces.length !== v.pieces.length;
        view = v;
        if (turnChanged || !myTurn()) selPiece = reach = dest = null;
        const who = v.phase === 'place' ? v.placer : v.turn;
        if (v.phase === 'end') status.textContent = '게임 종료';
        else if (myTurn()) status.innerHTML = v.phase === 'place' ? '<span class="hl">말을 놓을 빈칸을 고르세요</span>' : '<span class="hl">내 차례</span> — 말 → 이동할 칸 → 벽 순서로 고르세요';
        else status.innerHTML = `<span style="color:${COL[who]}">●</span> ${v.names[who]} 차례`;
        draw();
        scoreBox.innerHTML = '';
        scoreBox.append(UIx.scoreboard(v.names.map((n, i) => ({ name: n, value: v.scores[i], me: i === v.me }))));
        info.innerHTML = v.names.map((n, i) => `<span style="color:${COL[i]}">●</span> ${n}`).join(' &nbsp; ') + '<br>확정 영역 = 한 사람의 말만 있는 닫힌 구역의 칸 수';
      },
    };
  }

  registerGame({
    id: 'wallgo', name: '벽바둑 2', en: 'Wall Go II',
    summary: '말을 옮기고 벽을 세워 내 말만 있는 구역을 최대한 넓게 만드세요.',
    players: { min: 1, max: 4, default: 2, soloSeats: 2, minSeats: 2 },
    rules: `
    <ul>
      <li>7×7 판. 말 개수는 2명이면 4개씩, 3명이면 3개씩, 4명이면 2개씩입니다. 먼저 번갈아(뱀 순서) 원하는 빈칸에 모두 놓습니다.</li>
      <li>자기 차례에 말 하나를 <b>0~2칸</b> 상하좌우로 옮깁니다(꺾어도 되지만 벽과 말은 통과 불가).</li>
      <li>옮긴 뒤에는 반드시 그 말이 있는 칸의 한 변에 <b>벽</b>을 세웁니다.</li>
      <li>모든 구역에 <b>한 사람의 말만</b> 남으면 끝. 내 말만 있는 구역의 칸 수 합이 점수입니다.</li>
    </ul>
    <div class="note">「벽바둑 2」의 세부 규칙은 공개되지 않아 시즌 2 「벽바둑」 기본 규칙을 따랐습니다.</div>`,
    engine, ui,
  });
})();

</script>
  <script>/* js/games/symmetry.js */
// 4일차 유배지 매치 — 대칭 퍼즐
(() => {
  const MODES = { V: { syms: ['V'], n: 8 }, VH: { syms: ['V', 'H'], n: 8 }, DR: { syms: ['D', 'R'], n: 8 }, ALL: { syms: ['V', 'H', 'D'], n: 10 } };
  const SYM_NAME = { V: '좌우 대칭(세로축)', H: '상하 대칭(가로축)', D: '대각선 대칭(↘)', R: '90° 회전 대칭' };
  const COLORS = ['#e5383b', '#f2c14e', '#4a90e2'];
  const TIME = 180000, COUNTDOWN = 3000;

  function makePuzzle(modeKey) {
    const { syms, n: N } = MODES[modeKey];
    const tf = { V: (r, c) => [r, N - 1 - c], H: (r, c) => [N - 1 - r, c], D: (r, c) => [c, r], R: (r, c) => [c, N - 1 - r] };
    const target = U.range(N).map(() => Array(N).fill(-1));
    const given = U.range(N).map(() => Array(N).fill(false));
    const seen = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!seen.has(`${r},${c}`)) {
      const orbit = [[r, c]], st = [[r, c]]; seen.add(`${r},${c}`);
      while (st.length) { const [a, b] = st.pop(); for (const s of syms) { const [x, y] = tf[s](a, b); if (!seen.has(`${x},${y}`)) { seen.add(`${x},${y}`); st.push([x, y]); orbit.push([x, y]); } } }
      if (Math.random() < 0.4) {
        const col = U.rnd(COLORS.length);
        orbit.forEach(([a, b]) => (target[a][b] = col));
        const [gr, gc] = U.pick(orbit); given[gr][gc] = true;
      }
    }
    return { N, syms, target, given };
  }

  const engine = {
    setup(seats, opts) {
      const mode = opts.mode || 'VH';
      const shared = makePuzzle(mode);
      const st = { seats, n: seats.length, P: [], phase: [], start: [], deadline: [], time: [], botAt: [] };
      seats.forEach((s, i) => {
        st.P[i] = opts.local && !s.bot ? makePuzzle(mode) : shared;
        st.time[i] = null;
        if (opts.local && !s.bot) st.phase[i] = 'ready';
        else { st.phase[i] = 'play'; st.start[i] = opts.now + COUNTDOWN; st.deadline[i] = st.start[i] + TIME; }
        if (s.bot) st.botAt[i] = Math.random() < 0.8 ? TIME * (0.3 + Math.random() * 0.65) : Infinity;
      });
      return st;
    },
    action(st, seat, a, now) {
      if (a.t === 'begin' && st.phase[seat] === 'ready') { st.phase[seat] = 'play'; st.start[seat] = now + COUNTDOWN; st.deadline[seat] = st.start[seat] + TIME; return; }
      if (a.t === 'paint' && st.phase[seat] === 'play' && now >= st.start[seat] && Array.isArray(a.paint)) {
        const T = st.P[seat].target;
        const ok = T.every((row, r) => row.every((v, c) => (a.paint[r] || [])[c] === v));
        if (ok) { st.phase[seat] = 'done'; st.time[seat] = now - st.start[seat]; return; }
        return false;
      }
      return false;
    },
    tick(st, now) {
      let ch = false;
      st.seats.forEach((s, i) => {
        if (st.phase[i] !== 'play') return;
        if (s.bot && now - st.start[i] >= st.botAt[i]) { st.phase[i] = 'done'; st.time[i] = st.botAt[i]; ch = true; }
        else if (now > st.deadline[i]) { st.phase[i] = 'out'; ch = true; }
      });
      return ch;
    },
    active: (st) => U.range(st.n).filter((i) => !st.seats[i].bot && (st.phase[i] === 'ready' || st.phase[i] === 'play')),
    hidden: () => true,
    view(st, me) {
      const v = { phase: me >= 0 ? st.phase[me] : 'watch', status: st.phase.slice(), times: st.time.slice() };
      if (me >= 0) {
        const P = st.P[me];
        Object.assign(v, { N: P.N, syms: P.syms, start: st.start[me], deadline: st.deadline[me], pid: st.P.indexOf(P) + '-' + P.target.flat().join(''),
          given: P.given.map((row, r) => row.map((g, c) => (g ? P.target[r][c] : -1))) });
        if (st.phase[me] === 'done' || st.phase[me] === 'out') v.answer = P.target;
      }
      return v;
    },
    over(st) {
      if (st.phase.some((p) => p === 'ready' || p === 'play')) return null;
      return { ranking: UIx.rankBy(U.range(st.n), (i) => (st.time[i] == null ? 1e12 : st.time[i])).map((x) => ({ ...x, score: st.time[x.seat] == null ? '실패' : (st.time[x.seat] / 1000).toFixed(1) + '초' })) };
    },
  };

  function ui(root, ctx) {
    let view = null, paint = null, pid = null, color = 0, dragging = false, cells = [];
    const head = h('div', { class: 'big' });
    const boardEl = h('div', { class: 'board' });
    const box = h('div', { class: 'col', style: { alignItems: 'center' } });
    const timerEl = h('span', { class: 'timer' });
    const symEl = h('div', { class: 'hl' });
    const palette = h('div', { class: 'row' });
    const scoreBox = h('div');

    function build() {
      const N = view.N, sz = N > 8 ? 38 : 46;
      boardEl.innerHTML = ''; cells = [];
      boardEl.style.gridTemplateColumns = `repeat(${N}, ${sz}px)`;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const el = h('div', { class: 'cell', style: { height: sz + 'px', cursor: 'pointer', color: '#0d0d10' }, 'data-r': r, 'data-c': c });
        cells.push(el); boardEl.append(el);
      }
    }
    function draw() {
      if (!view.N) return;
      const N = view.N, src = view.answer || paint;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const el = cells[r * N + c], v = src[r][c];
        el.style.background = v >= 0 ? COLORS[v] : '';
        el.textContent = view.given[r][c] >= 0 ? '◆' : '';
      }
    }
    function setCell(r, c) {
      if (!view || view.phase !== 'play' || ctx.now() < view.start || view.given[r][c] >= 0) return;
      if (paint[r][c] === color) return;
      paint[r][c] = color; draw();
      ctx.send({ t: 'paint', paint });
    }
    const at = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.dataset && t.dataset.r != null ? [+t.dataset.r, +t.dataset.c] : null; };
    boardEl.addEventListener('pointerdown', (e) => { const p = at(e); if (p) { dragging = true; boardEl.releasePointerCapture?.(e.pointerId); setCell(...p); } });
    boardEl.addEventListener('pointermove', (e) => { if (dragging) { const p = at(e); if (p) setCell(...p); } });
    const up = () => (dragging = false);
    document.addEventListener('pointerup', up);

    function renderPalette() {
      palette.innerHTML = '';
      [...COLORS, null].forEach((col, i) => palette.append(h('button', {
        class: 'btn' + ((col ? i : -1) === color ? ' on' : ''), style: { width: '52px', height: '40px', background: col || 'transparent' },
        onclick: () => { color = col ? i : -1; renderPalette(); } }, col ? '' : '지우개')));
    }
    function tickTimer() {
      const v = view; if (!v || v.phase !== 'play') { timerEl.textContent = ''; return; }
      const now = ctx.now();
      if (now < v.start) { head.innerHTML = `시작까지 <span class="hl">${UIx.secs(v.start, now)}</span>`; return; }
      head.textContent = '대칭이 되도록 칠하세요';
      const s = UIx.secs(v.deadline, now);
      timerEl.textContent = UIx.mmss(s); timerEl.classList.toggle('warn', s <= 20);
    }
    const iv = setInterval(tickTimer, 250);

    root.append(h('div', { class: 'split' },
      h('div', { class: 'col', style: { alignItems: 'center' } }, head, box, boardEl, h('div', { class: 'muted', style: { fontSize: '13px' } }, '◆ = 단서 칸 (바꿀 수 없음)')),
      h('div', { class: 'col' },
        h('div', { class: 'panel row' }, h('span', {}, '남은 시간'), h('span', { style: { flex: 1 } }), timerEl),
        h('div', { class: 'panel col' }, h('h4', {}, '만족해야 할 대칭'), symEl),
        h('div', { class: 'panel col' }, h('h4', {}, '색'), palette),
        h('div', { class: 'panel col' }, h('h4', {}, '진행 상황'), scoreBox))));
    renderPalette();

    return {
      update(v) {
        view = v;
        if (v.N && v.pid !== pid) { pid = v.pid; paint = v.given.map((row) => row.slice()); build(); }
        const playing = v.phase !== 'ready' && v.phase !== 'watch';
        boardEl.style.display = playing ? '' : 'none';
        box.innerHTML = '';
        if (v.phase === 'ready') { head.textContent = ''; box.append(h('div', { class: 'big' }, `${v.names[v.me]} 님 준비`), h('button', { class: 'btn primary', onclick: () => ctx.send({ t: 'begin' }) }, '시작')); }
        if (v.phase === 'watch') { head.textContent = ''; box.append(h('div', { class: 'muted' }, '다른 플레이어를 기다리는 중...')); }
        if (v.phase === 'done') head.innerHTML = '<span class="good">완성!</span> 다른 플레이어를 기다리는 중';
        if (v.phase === 'out') head.innerHTML = '<span class="bad">시간 초과</span> — 정답을 보여 드려요';
        symEl.innerHTML = v.syms ? v.syms.map((s) => SYM_NAME[s]).join('<br>') : '';
        if (playing) draw();
        tickTimer();
        scoreBox.innerHTML = '';
        scoreBox.append(UIx.scoreboard(v.names.map((n, i) => ({ name: n, me: i === v.me, value: v.status[i] === 'done' ? (v.times[i] / 1000).toFixed(0) + 's' : v.status[i] === 'out' ? '✕' : '…' }))));
      },
      destroy() { clearInterval(iv); document.removeEventListener('pointerup', up); },
    };
  }

  registerGame({
    id: 'symmetry', name: '대칭 퍼즐', en: 'Symmetrical Puzzle',
    summary: '흩어진 단서 칸을 보고, 주어진 대칭축에 맞게 그림 전체를 완성하세요. 여럿이면 누가 먼저 푸나 대결!',
    players: { min: 1, max: 8, default: 1, soloSeats: 1, minSeats: 1 },
    options: [{ key: 'mode', label: '대칭', default: 'VH', choices: [['V', '좌우'], ['VH', '좌우+상하'], ['DR', '대각선+회전'], ['ALL', '8방향']] }],
    rules: `
    <ul>
      <li>격자 위에 색칠된 <b>단서 칸(◆)</b> 몇 개와 <b>대칭 조건</b>이 주어집니다.</li>
      <li>완성된 그림은 주어진 대칭을 <b>모두</b> 만족해야 합니다. 단서를 대칭으로 옮겨 나머지 칸을 칠하세요.</li>
      <li>색을 고르고 칸을 클릭(또는 드래그)해 칠합니다. 필요한 칸만 정확히 칠해지면 자동 완료.</li>
      <li>제한 시간 3분. 여럿이 하면 <b>빨리 푼 순서</b>로 순위가 정해집니다.</li>
    </ul>`,
    engine, ui,
  });
})();

</script>
</body>
</html>
